<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #f2f4f6; color: #191f28; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; letter-spacing: -0.3px; font-size: 22px; }
    .page { max-width: 1080px; margin: 0 auto; padding: 24px 22px 60px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .title { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin: 0; }
    .sub { font-size: 20px; color: #6b7684; margin-top: 6px; }
    .btn-home { border: 0; background: #fff; color: #191f28; font-size: 20px; font-weight: 700; padding: 14px 22px; border-radius: 16px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.06); text-decoration: none; }
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 20px; }
    .tab { border: 0; background: #fff; color: #4e5968; font-size: 22px; font-weight: 700; padding: 16px 22px; border-radius: 18px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .tab.on { background: #191f28; color: #fff; }
    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .stat { background: #fff; border-radius: 22px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .stat .k { font-size: 18px; color: #6b7684; font-weight: 700; }
    .stat .v { font-size: 34px; font-weight: 800; margin-top: 6px; }
    .stat .v small { font-size: 18px; color: #8b95a1; font-weight: 600; }
    .card { background: #fff; border-radius: 24px; padding: 8px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 22px; }
    th { text-align: left; font-size: 18px; color: #6b7684; font-weight: 700; padding: 16px 12px; border-bottom: 2px solid #f2f4f6; white-space: nowrap; }
    td { padding: 18px 12px; border-bottom: 1px solid #f2f4f6; white-space: nowrap; font-weight: 600; }
    td.num { font-weight: 800; font-size: 26px; }
    .pill { display: inline-block; font-size: 19px; font-weight: 800; padding: 8px 14px; border-radius: 12px; }
    .pill.ok { background: #e6f7ef; color: #02a262; }
    .pill.wait { background: #fff1e6; color: #f76808; }
    .pill.cancel { background: #eef1f4; color: #8b95a1; }
    tr.cancelled td { color: #8b95a1; }
    tr.cancelled td.name, tr.cancelled td.phone { text-decoration: line-through; }
    .empty { font-size: 24px; color: #8b95a1; text-align: center; padding: 50px 0; }
    .note { font-size: 18px; color: #6b7684; margin-top: 16px; line-height: 1.6; }
    @media (max-width: 640px) {
      body { font-size: 17px; }
      .page { padding: 16px 12px 40px; }
      .title { font-size: 26px; }
      .sub { font-size: 15px; }
      .btn-home { font-size: 16px; padding: 10px 14px; }
      .tab { font-size: 16px; padding: 10px 14px; border-radius: 14px; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .stat .v { font-size: 26px; }
      .stat .k { font-size: 14px; }
      table { font-size: 16px; }
      th { font-size: 14px; padding: 12px 8px; }
      td { padding: 12px 8px; }
      td.num { font-size: 20px; }
      .pill { font-size: 14px; padding: 6px 9px; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1 class="title"><?= termName ?> 접수 현황</h1>
      <div class="sub" id="updated">불러오는 중…</div>
    </div>
    <a class="btn-home" href="__WEB_APP_URL__?term=<?= termId ?>">신청 화면으로</a>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="summary" id="summary"></div>

  <div class="card">
    <table>
      <thead>
        <tr><th>순번</th><th>신청일시</th><th>신청자</th><th>연락처</th><th>접수 상태</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="5" class="empty">강좌를 불러오는 중이에요</td></tr></tbody>
    </table>
  </div>

  <p class="note">
    · 접수 순번은 신청한 순서대로 정해지며, 취소해도 다른 사람의 순번은 바뀌지 않아요.<br>
    · 정원까지는 <b>접수완료</b>, 그 다음은 <b>대기</b>이며 앞 사람이 취소하면 대기 순번이 올라가요.<br>
    · 이름과 연락처는 개인정보 보호를 위해 일부만 보여 드려요.
  </p>
</div>

<script>
  // 학기 ID (웹앱 주소의 ?term= 값, 서버가 채워 줌)
  const TERM = '<?= termId ?>';
  let courseList = [];
  let current = '';

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  }

  window.onload = () => {
    google.script.run
      .withSuccessHandler(data => {
        courseList = data.courses || [];
        const tabs = document.getElementById('tabs');
        tabs.innerHTML = courseList.map((c, i) => {
          const name = String(c.display).split('|')[0].trim();
          return '<button class="tab" data-i="' + i + '">' + esc(name) + '</button>';
        }).join('');
        tabs.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => pick(courseList[Number(b.dataset.i)].name, b)));
        if (courseList.length) {
          const first = tabs.querySelector('.tab');
          pick(courseList[0].name, first);
        } else {
          document.getElementById('rows').innerHTML = '<tr><td colspan="5" class="empty">강좌가 없어요</td></tr>';
        }
      })
      .withFailureHandler(err => alert('강좌 정보를 불러오지 못했어요: ' + err.message))
      .getInitialData(TERM);
  };

  function pick(name, btn) {
    current = name;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === btn));
    load();
  }

  function load() {
    const name = current;
    google.script.run
      .withSuccessHandler(d => {
        if (name !== current) return; // 다른 과목을 이미 눌렀으면 무시
        const left = Math.max(0, d.quota - d.active);
        document.getElementById('summary').innerHTML =
          stat('정원', d.quota + '<small>명</small>') +
          stat('접수완료', d.active + '<small>명</small>') +
          stat('대기', d.waiting + '<small>명</small>') +
          stat('남은 자리', left + '<small>명</small>');
        document.getElementById('updated').textContent = d.checkedAt + ' 기준 · ' + (d.mode === '선착순' ? '선착순 접수' : '추첨 방식');
        const rows = d.rows || [];
        document.getElementById('rows').innerHTML = rows.length ? rows.map(r => {
          const cls = r.cancelled ? 'cancel' : (r.status === '접수완료' ? 'ok' : 'wait');
          return '<tr class="' + (r.cancelled ? 'cancelled' : '') + '">' +
            '<td class="num">' + r.seq + '</td>' +
            '<td>' + esc(r.time) + '</td>' +
            '<td class="name">' + esc(r.name) + '</td>' +
            '<td class="phone">' + esc(r.phone) + '</td>' +
            '<td><span class="pill ' + cls + '">' + esc(r.cancelled ? '취소' : r.status) + '</span></td></tr>';
        }).join('') : '<tr><td colspan="5" class="empty">아직 신청자가 없어요</td></tr>';
      })
      .withFailureHandler(err => alert('현황을 불러오지 못했어요: ' + err.message))
      .getPublicStatus(TERM, name);
  }

  function stat(k, v) {
    return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  }
</script>
</body>
</html>
