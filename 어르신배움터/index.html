<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --bg: #f2f4f6;
      --card: #ffffff;
      --text: #191f28;
      --sub: #6b7684;
      --muted: #8b95a1;
      --line: #e5e8eb;
      --blue: #3182f6;
      --blue-soft: #e8f3ff;
      --green: #02a262;
      --green-soft: #e6f7ef;
      --orange: #f76808;
      --orange-soft: #fff1e6;
      --red: #f04452;
      --red-soft: #feeceb;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #17181c; --card: #22242a; --text: #f2f4f6; --sub: #b0b8c1; --muted: #8b95a1; --line: #33363d; --blue-soft: #1d2d44; --green-soft: #16372a; --orange-soft: #3d2a18; --red-soft: #3d1f22; }
    }
    :root[data-theme="dark"] { --bg: #17181c; --card: #22242a; --text: #f2f4f6; --sub: #b0b8c1; --muted: #8b95a1; --line: #33363d; --blue-soft: #1d2d44; --green-soft: #16372a; --orange-soft: #3d2a18; --red-soft: #3d1f22; }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
      letter-spacing: -0.2px; -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 520px; margin: 0 auto; padding: 24px 16px 140px; min-height: 100vh; }
    .hidden { display: none !important; }

    /* 헤더 */
    .brand { text-align: center; padding-top: 8px; }
    .brand img { max-height: 44px; width: auto; object-fit: contain; }
    .title { margin: 18px 4px 6px; font-size: 26px; font-weight: 800; line-height: 1.35; letter-spacing: -0.6px; }
    .subtitle { margin: 0 4px 20px; font-size: 15px; color: var(--sub); line-height: 1.5; }
    .pill-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
    .pill {
      border: 0; background: var(--card); color: var(--text); font-size: 14px; font-weight: 600;
      padding: 9px 14px; border-radius: 999px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer;
    }
    .pill:active { transform: scale(.98); }

    /* 카드와 입력 */
    .card { background: var(--card); border-radius: 20px; padding: 22px 18px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    .section-title { font-size: 17px; font-weight: 700; margin: 0 0 14px; }
    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    .label { display: block; font-size: 14px; font-weight: 600; color: var(--sub); margin: 0 2px 8px; }
    .input {
      width: 100%; height: 56px; border: 0; border-radius: 14px; background: var(--bg); color: var(--text);
      padding: 0 16px; font-size: 17px; font-weight: 500; outline: none; transition: box-shadow .15s, background .15s;
    }
    .input::placeholder { color: var(--muted); font-weight: 400; }
    .input:focus { background: var(--card); box-shadow: 0 0 0 2px var(--blue); }
    select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%); background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }

    /* 성별 선택 (세그먼트) */
    .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .segment input { position: absolute; opacity: 0; pointer-events: none; }
    .segment label {
      height: 52px; border-radius: 14px; background: var(--bg); color: var(--sub); font-size: 16px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s;
    }
    .segment input:checked + label { background: var(--blue); color: #fff; }

    /* 강좌 */
    .day-title { font-size: 15px; font-weight: 700; color: var(--sub); margin: 22px 4px 10px; }
    .day-title:first-child { margin-top: 4px; }
    .course-card {
      background: var(--card); border-radius: 18px; padding: 16px 18px; margin-bottom: 10px; cursor: pointer;
      border: 2px solid transparent; box-shadow: 0 1px 4px rgba(0,0,0,.05); transition: border-color .15s, background .15s;
    }
    .course-card:active { transform: scale(.995); }
    .course-card.selected { border-color: var(--blue); background: var(--blue-soft); }
    .cc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .cc-name { font-size: 17px; font-weight: 700; line-height: 1.4; }
    .cc-check { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .cc-meta { font-size: 14px; color: var(--sub); margin-top: 6px; line-height: 1.5; }
    .cc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 8px; }
    .badge.ok { background: var(--green-soft); color: var(--green); }
    .badge.warn { background: var(--orange-soft); color: var(--orange); }
    .badge.bad { background: var(--red-soft); color: var(--red); }
    .fee { font-size: 14px; font-weight: 600; color: var(--sub); }
    .empty { text-align: center; color: var(--muted); padding: 32px 0; font-size: 15px; }

    /* 동의 */
    .consent { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .consent input { width: 22px; height: 22px; accent-color: var(--blue); margin: 0; }

    /* 하단 고정 버튼 */
    .bottom-bar {
      position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, rgba(242,244,246,0));
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); z-index: 20;
    }
    .bottom-inner { max-width: 520px; margin: 0 auto; }
    .summary { font-size: 14px; color: var(--sub); margin: 0 4px 8px; text-align: center; }
    .btn-primary {
      width: 100%; height: 56px; border: 0; border-radius: 16px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: opacity .15s, transform .05s;
    }
    .btn-primary:active { transform: scale(.99); }
    .btn-primary:disabled { background: #c9ced6; cursor: default; }
    .btn-ghost {
      width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--card); color: var(--text); font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .btn-ghost.plain { background: transparent; box-shadow: none; color: var(--sub); }

    /* 완료 화면 */
    .done { text-align: center; padding: 56px 12px 24px; }
    .done-icon { width: 84px; height: 84px; border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: 44px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .done h2 { font-size: 24px; font-weight: 800; margin: 22px 0 8px; }
    .done p { color: var(--sub); font-size: 15px; line-height: 1.6; margin: 0 0 28px; }

    /* 결과 조회 */
    .result-wrap .card { margin-bottom: 12px; }

    @media (max-width: 380px) { .title { font-size: 23px; } .cc-name { font-size: 16px; } }
  </style>
</head>
<body>
<?!= include('navbar'); ?>

<!-- 신청 화면 -->
<div class="page" id="mainView">
  <div class="brand"><img id="mainLogoImg" src="" alt="거제시종합사회복지관 로고"></div>
  <h1 class="title"><?= termName ?> 수강신청</h1>
  <p class="subtitle">신청 정보를 입력하고 원하는 강좌를 선택해 주세요. 최대 5개까지 고를 수 있어요.</p>
  <div class="pill-row">
    <button type="button" class="pill" onclick="goToCheckPage()">🔍 내 신청 확인</button>
    <button type="button" class="pill" onclick="safeRefresh()">🔄 새로고침</button>
  </div>

  <section class="card">
    <h2 class="section-title">신청자 정보</h2>
    <div class="field">
      <label class="label" for="userName">성명</label>
      <input type="text" id="userName" class="input" placeholder="실명을 입력해 주세요" onchange="checkJobTimeRealtime()">
    </div>
    <div class="field">
      <span class="label">성별</span>
      <div class="segment">
        <input type="radio" name="gender" id="m" value="남"><label for="m">남성</label>
        <input type="radio" name="gender" id="f" value="여"><label for="f">여성</label>
      </div>
    </div>
    <div class="field">
      <label class="label" for="userDob">생년월일 (6자리)</label>
      <input type="number" id="userDob" class="input" placeholder="예) 500101" onchange="checkJobTimeRealtime()">
    </div>
    <div class="field">
      <label class="label" for="userPhone">연락처</label>
      <input type="tel" id="userPhone" class="input" placeholder="010-0000-0000" maxlength="13" oninput="formatPhone(this)">
    </div>
    <div class="field">
      <label class="label" for="benefit">수강료 면제 사유</label>
      <select id="benefit" class="input">
        <option value="해당없음">해당없음</option><option value="기초생활수급자">기초생활수급자</option><option value="차상위계층">차상위계층</option><option value="국가유공자">국가유공자</option><option value="중증장애인">중증장애인</option>
      </select>
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">강좌 선택</h2>
    <div id="courseList"><div class="empty">강좌를 불러오는 중이에요</div></div>
  </section>

  <section class="card">
    <label class="consent"><input type="checkbox" id="consent"> 개인정보 수집·이용에 동의합니다 (필수)</label>
  </section>
</div>

<div class="bottom-bar" id="bottomBar">
  <div class="bottom-inner">
    <div class="summary" id="selSummary">선택한 강좌 0개</div>
    <button onclick="submitData()" id="submitBtn" class="btn-primary">수강신청 완료하기</button>
  </div>
</div>

<!-- 내 신청 및 결과 확인 화면 -->
<div class="page hidden" id="checkView">
  <h1 class="title">내 신청 및 결과 확인</h1>
  <p class="subtitle">신청할 때 입력한 정보를 똑같이 적어 주세요.</p>
  <section class="card">
    <div class="field"><label class="label" for="chkName">성명</label><input type="text" id="chkName" class="input" placeholder="실명"></div>
    <div class="field"><label class="label" for="chkDob">생년월일 (6자리)</label><input type="number" id="chkDob" class="input" placeholder="예) 500101"></div>
    <div class="field"><label class="label" for="chkPhone">연락처</label><input type="tel" id="chkPhone" class="input" placeholder="010-0000-0000" maxlength="13" oninput="formatPhone(this)"></div>
  </section>
  <button onclick="checkApp()" id="chkBtn" class="btn-primary">조회하기</button>
  <button onclick="hideCheckView()" class="btn-ghost">돌아가기</button>
</div>

<!-- 조회 결과 화면 -->
<div class="page hidden" id="resultView">
  <h1 class="title" id="resTitle">조회 결과</h1>
  <div class="result-wrap">
    <?!= include('resultView'); ?>
  </div>
  <button onclick="hideCheckView()" class="btn-primary" style="margin-top:12px">확인</button>
</div>

<!-- 접수 완료 화면 -->
<div class="page hidden" id="successView">
  <div class="done">
    <div class="done-icon">✓</div>
    <h2 id="successMsg">접수가 완료되었습니다!</h2>
    <p>신청 내역은 아래에서 언제든지 확인할 수 있어요.</p>
  </div>
  <button onclick="goToCheckDirectly()" class="btn-primary">방금 신청한 내역 확인하기</button>
  <button type="button" onclick="goToNewApplication()" class="btn-ghost">다른 사람 신청하기</button>
</div>

<script>
  // 학기 ID (웹앱 주소의 ?term= 값, 서버가 채워 줌)
  const TERM = '<?= termId ?>';
  const PHONE_RE = /^01[016789]-\d{3,4}-\d{4}$/;

  let courses = [];
  let jobTimes = {};
  let restrictions = [];
  let selected = [];
  let currentUserJob = null;

  // 연락처 입력 시 자동으로 하이픈 넣기
  function formatPhone(el) {
    const d = el.value.replace(/\D/g, '').slice(0, 11);
    if (d.length < 4) el.value = d;
    else if (d.length < 8) el.value = d.slice(0, 3) + '-' + d.slice(3);
    else if (d.length < 11) el.value = d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    else el.value = d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
  }

  // 상단 로고 (구글 드라이브 이미지를 서버에서 받아 표시)
  window.addEventListener('DOMContentLoaded', () => {
    google.script.run
      .withSuccessHandler(base64Data => {
        if (base64Data) document.getElementById('mainLogoImg').src = base64Data;
      })
      .withFailureHandler(err => console.log('로고 로딩 실패: ' + err.message))
      .getWelfareLogoData();
  });

  window.onload = () => {
    google.script.run
      .withSuccessHandler(data => {
        courses = data.courses || [];
        jobTimes = data.jobTimes || {};
        restrictions = data.restrictions || [];
        renderCourses();
      })
      .withFailureHandler(err => alert('강좌 정보를 불러오지 못했습니다: ' + err.message))
      .getInitialData(TERM);
  };

  function checkJobTimeRealtime() {
    const name = document.getElementById('userName').value.trim().replace(/\s/g, '');
    const dob = document.getElementById('userDob').value.trim().replace(/[^0-9]/g, '');
    if (name && dob.length === 6) {
      const key = name + '_' + dob;
      if (jobTimes[key]) {
        currentUserJob = jobTimes[key];
        alert('[확인] 노인일자리 참여자입니다.\n활동시간(' + currentUserJob.start + '~' + currentUserJob.end + ')과 겹치는 강좌는 요일 상관없이 제외됩니다.');
      } else {
        currentUserJob = null;
      }
    }
    selected = [];
    renderCourses();
  }

  // 정원 초과 시 '추첨예정(정원초과 X명)'으로 표시
  function renderCourses() {
    const list = document.getElementById('courseList');
    list.innerHTML = '';
    ['월', '화', '수', '목', '금'].forEach(d => {
      const items = courses.filter(c => c.day === d);
      if (!items.length) return;
      const h = document.createElement('div');
      h.className = 'day-title';
      h.textContent = d + '요일';
      list.appendChild(h);

      items.forEach(c => {
        const idx = courses.indexOf(c);
        const isSel = selected.includes(idx);
        const parts = String(c.display).split('|').map(s => s.trim());
        const name = parts[0];
        const fee = parts.length > 1 ? parts[parts.length - 1] : '';

        let badgeCls = 'ok';
        let statusText = '잔여 ' + c.remaining + '석 · 신청 ' + c.current + '명';
        if (c.current >= c.quota) {
          badgeCls = 'bad';
          statusText = '추첨예정 · 정원초과 ' + (c.current - c.quota) + '명';
        } else if (c.remaining <= 3) {
          badgeCls = 'warn';
          statusText = '마감임박 · ' + c.remaining + '석 남음';
        }

        const div = document.createElement('div');
        div.className = 'course-card' + (isSel ? ' selected' : '');
        div.innerHTML =
          '<div class="cc-top"><div class="cc-name">' + escapeText(name) + '</div>' +
          (isSel ? '<span class="cc-check">✓</span>' : '') + '</div>' +
          '<div class="cc-meta">' + escapeText(c.start || '미지정') + ' ~ ' + escapeText(c.end || '미지정') + ' · 정원 ' + c.quota + '명</div>' +
          '<div class="cc-foot"><span class="badge ' + badgeCls + '">' + escapeText(statusText) + '</span>' +
          (fee ? '<span class="fee">' + escapeText(fee) + '</span>' : '') + '</div>';
        div.onclick = () => toggleCourse(idx);
        list.appendChild(div);
      });
    });
    if (!list.children.length) list.innerHTML = '<div class="empty">신청 가능한 강좌가 없어요</div>';
    updateSummary();
  }

  function updateSummary() {
    document.getElementById('selSummary').textContent = '선택한 강좌 ' + selected.length + '개' + (selected.length ? '' : ' · 강좌를 골라 주세요');
  }

  function escapeText(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  }

  function toggleCourse(idx) {
    const target = courses[idx];
    const targetName = target.display;

    // 노인일자리 시간 중복 체크
    if (currentUserJob && currentUserJob.start && currentUserJob.end) {
      if (target && target.start && target.end) {
        if (target.start < currentUserJob.end && target.end > currentUserJob.start) {
          return alert('[선택 불가] 노인일자리 시간(' + currentUserJob.start + '~' + currentUserJob.end + ')과 중복됩니다.');
        }
      }
    }

    if (selected.includes(idx)) {
      selected = selected.filter(i => i !== idx);
    } else {
      if (selected.length >= 5) return alert('최대 5개 가능합니다.');

      // 중복 신청 제한 그룹 체크
      if (restrictions) {
        for (let group of restrictions) {
          const myMatch = group.find(gName => targetName.includes(gName));
          if (myMatch) {
            for (let sIdx of selected) {
              const selName = courses[sIdx].display;
              const otherMatch = group.find(gName => selName.includes(gName));
              if (otherMatch && otherMatch !== myMatch) {
                return alert("[중복 신청 제한]\n\n'" + myMatch + "' 강좌는 '" + otherMatch + "' 강좌와 동시에 신청할 수 없습니다.\n둘 중 하나만 선택해 주세요.");
              }
            }
          }
        }
      }

      // 선택한 다른 강좌와 시간 중복 체크
      const isOverlap = selected.some(sIdx => {
        const selC = courses[sIdx];
        if (selC.day !== target.day) return false;
        if (!target.start || !target.end || !selC.start || !selC.end) return false;
        return (target.start < selC.end && target.end > selC.start);
      });
      if (isOverlap) return alert('선택한 다른 강좌와 시간이 겹칩니다.');

      selected.push(idx);
    }
    renderCourses();
  }

  function goToCheckPage() {
    window.top.location.href = '__WEB_APP_URL__?mode=check&term=' + encodeURIComponent(TERM);
  }

  function submitData() {
    const name = document.getElementById('userName').value.trim();
    const dob = document.getElementById('userDob').value.trim();
    const phone = document.getElementById('userPhone').value.trim();
    const gender = document.querySelector('input[name="gender"]:checked')?.value;
    const benefit = document.getElementById('benefit').value;
    const consent = document.getElementById('consent').checked;
    if (!name || !dob || !phone || !gender || !consent) return alert('필수 항목을 입력하세요.');
    if (!PHONE_RE.test(phone)) return alert('연락처는 010-0000-0000 형식으로 입력해 주세요.');
    if (selected.length === 0) return alert('과목을 선택하세요.');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '신청 중...';
    google.script.run
      .withSuccessHandler(msg => {
        document.getElementById('mainView').classList.add('hidden');
        document.getElementById('bottomBar').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');
        document.getElementById('successMsg').textContent = msg;
        window.scrollTo(0, 0);
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = '수강신청 완료하기';
        alert(err.message);
      })
      .submitForm({ name, dob, phone, gender, benefit, term: TERM, selectedCourses: selected.map(i => courses[i].display) });
  }

  function showCheckView() {
    document.getElementById('mainView').classList.add('hidden');
    document.getElementById('bottomBar').classList.add('hidden');
    document.getElementById('checkView').classList.remove('hidden');
  }

  function hideCheckView() {
    document.getElementById('checkView').classList.add('hidden');
    document.getElementById('resultView').classList.add('hidden');
    document.getElementById('mainView').classList.remove('hidden');
    document.getElementById('bottomBar').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function goToNewApplication() {
    window.top.location.href = '__WEB_APP_URL__?term=' + encodeURIComponent(TERM);
  }

  function goToCheckDirectly() {
    document.getElementById('chkName').value = document.getElementById('userName').value.trim();
    document.getElementById('chkDob').value = document.getElementById('userDob').value.trim();
    document.getElementById('chkPhone').value = document.getElementById('userPhone').value.trim();
    document.getElementById('successView').classList.add('hidden');
    showCheckView();
  }

  function checkApp() {
    const name = document.getElementById('chkName').value.trim();
    const dob = document.getElementById('chkDob').value.trim();
    const phone = document.getElementById('chkPhone').value.trim();
    if (!name || !dob || !phone) return alert('정보를 모두 입력하세요.');
    if (!PHONE_RE.test(phone)) return alert('연락처는 010-0000-0000 형식으로 입력해 주세요.');

    google.script.run
      .withSuccessHandler(res => {
        if (!res.applied) return alert('입력하신 정보와 일치하는 신청 내역이 없습니다.');
        document.getElementById('checkView').classList.add('hidden');
        document.getElementById('resultView').classList.remove('hidden');
        renderUnifiedResultUI(res, name, dob, true);
        window.scrollTo(0, 0);
      })
      .withFailureHandler(err => alert('조회 중 오류가 발생했습니다: ' + err.message))
      .checkTotalStatus(name, phone, dob, TERM);
  }

  function safeRefresh() {
    window.top.location.href = '__WEB_APP_URL__?term=' + encodeURIComponent(TERM);
  }
</script>
</body>
</html>
