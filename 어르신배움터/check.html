<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --bg: #f2f4f6; --card: #ffffff; --text: #191f28; --sub: #6b7684; --muted: #8b95a1;
      --blue: #3182f6; --blue-soft: #e8f3ff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #17181c; --card: #22242a; --text: #f2f4f6; --sub: #b0b8c1; --muted: #8b95a1; --blue-soft: #1d2d44; }
    }
    :root[data-theme="dark"] { --bg: #17181c; --card: #22242a; --text: #f2f4f6; --sub: #b0b8c1; --muted: #8b95a1; --blue-soft: #1d2d44; }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
      letter-spacing: -0.2px; -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 520px; margin: 0 auto; padding: 24px 16px 60px; min-height: 100vh; }
    .title { margin: 14px 4px 6px; font-size: 26px; font-weight: 800; line-height: 1.35; letter-spacing: -0.6px; }
    .subtitle { margin: 0 4px 20px; font-size: 15px; color: var(--sub); line-height: 1.5; }
    .card { background: var(--card); border-radius: 20px; padding: 22px 18px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    .label { display: block; font-size: 14px; font-weight: 600; color: var(--sub); margin: 0 2px 8px; }
    .input {
      width: 100%; height: 56px; border: 0; border-radius: 14px; background: var(--bg); color: var(--text);
      padding: 0 16px; font-size: 17px; font-weight: 500; outline: none; transition: box-shadow .15s, background .15s;
    }
    .input::placeholder { color: var(--muted); font-weight: 400; }
    .input:focus { background: var(--card); box-shadow: 0 0 0 2px var(--blue); }
    .btn-primary {
      width: 100%; height: 56px; border: 0; border-radius: 16px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 700;
      cursor: pointer; margin-top: 4px;
    }
    .btn-primary:active { transform: scale(.99); }
    .btn-primary:disabled { background: #c9ced6; cursor: default; }
    .btn-ghost {
      width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--card); color: var(--text); font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<?!= include('navbar'); ?>
<div class="page">
  <h1 class="title"><?= termName ?> 신청 및 결과 조회</h1>
  <p class="subtitle">신청할 때 입력한 성명, 생년월일, 연락처를 적어 주세요.</p>

  <section class="card">
    <div class="field"><label class="label" for="name">성명</label><input type="text" id="name" class="input" placeholder="실명"></div>
    <div class="field"><label class="label" for="dob">생년월일 (6자리)</label><input type="number" id="dob" class="input" placeholder="예) 500101"></div>
    <div class="field"><label class="label" for="phone">연락처</label><input type="tel" id="phone" class="input" placeholder="010-0000-0000" maxlength="13" oninput="formatPhone(this)"></div>
  </section>

  <button onclick="search()" class="btn-primary" id="btnText">결과 확인하기</button>
  <button type="button" onclick="goToMainIndex()" class="btn-ghost">처음 수강신청 화면으로 돌아가기</button>

  <!-- 결과 위치: 버튼 바로 아래 -->
  <div id="displayArea" class="hidden" style="margin-top:20px">
    <?!= include('resultView'); ?>
  </div>
</div>

<script>
  // 학기 ID (웹앱 주소의 ?term= 값, 서버가 채워 줌)
  const TERM = '<?= termId ?>';
  const PHONE_RE = /^01[016789]-\d{3,4}-\d{4}$/;

  function formatPhone(el) {
    const d = el.value.replace(/\D/g, '').slice(0, 11);
    if (d.length < 4) el.value = d;
    else if (d.length < 8) el.value = d.slice(0, 3) + '-' + d.slice(3);
    else if (d.length < 11) el.value = d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    else el.value = d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
  }

  // 상단 네비바 로드 (navbar.html 이 mainNavbar 요소를 가질 때)
  window.addEventListener('DOMContentLoaded', () => {
    if (document.getElementById('mainNavbar')) document.getElementById('mainNavbar').style.display = 'block';
  });

  function goToMainIndex() {
    window.top.location.href = '__WEB_APP_URL__?term=' + encodeURIComponent(TERM);
  }

  function search() {
    const name = document.getElementById('name').value.trim();
    const dob = document.getElementById('dob').value.trim();
    const phone = document.getElementById('phone').value.trim();

    if (!name || !dob || !phone) return alert('정보를 모두 입력해주세요.');
    if (!PHONE_RE.test(phone)) return alert('연락처는 010-0000-0000 형식으로 입력해 주세요.');

    const btn = document.getElementById('btnText');
    btn.textContent = '조회 중...';
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(data => {
        btn.textContent = '결과 확인하기';
        btn.disabled = false;
        if (!data.applied) return alert('입력하신 정보와 일치하는 신청 내역이 없습니다.');
        document.getElementById('displayArea').classList.remove('hidden');
        renderUnifiedResultUI(data, name, dob, false);
      })
      .withFailureHandler(err => {
        btn.textContent = '결과 확인하기';
        btn.disabled = false;
        alert('조회 중 시스템 오류가 발생했습니다: ' + err.message);
      })
      .checkTotalStatus(name, phone, dob, TERM);
  }
</script>
</body>
</html>
