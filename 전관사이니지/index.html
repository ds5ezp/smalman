<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복지관 스마트 사이니지</title>
    <!-- Tailwind CSS v3 (Play CDN). 기존 v2 CSS는 v3 클래스(shrink-0, bg-slate-950, bg-black/30 등)를 지원하지 않아 교체 -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pretendard (대시보드와 같은 글꼴) -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #080d1a;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            letter-spacing: -0.01em;
        }

        .logo-glow {
            filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.5));
        }

        .line-clamp-2 {
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .line-clamp-10 {
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 10;
        }

        #slide-display, #fullscreen-display {
            transition: opacity 0.6s ease-in-out;
        }

        .img-fade-transition {
            transition: opacity 0.5s ease-in-out;
        }

        .mode-transition {
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes progressAnimation {
            from { width: 0%; }
            to { width: 100%; }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col relative" style="background-color: #020617;">

    <!-- [에너지 절약 모드 (Saving Mode) 오버레이] -->
    <div id="saving-overlay" class="fixed inset-0 z-50 flex-col items-center justify-center p-12 text-center bg-black text-gray-400" style="display: none;">
        <div class="w-28 h-28 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center mb-6">
            <i class="fa-solid fa-moon text-6xl text-blue-500"></i>
        </div>
        <h1 class="text-5xl font-black mb-4 text-gray-200">에너지 절약 모드</h1>
        <p class="text-2xl font-bold text-gray-500 mb-2">Saving Mode</p>
        <div id="saving-time-text" class="text-xl text-gray-600 border border-gray-800 px-6 py-2 rounded-full mt-4">
            운영 시간 : 08:00 - 18:00
        </div>
    </div>

    <!-- [비상 모드 오버레이] -->
    <div id="emergency-overlay" class="fixed inset-0 z-50 flex-col items-center justify-center p-12 text-center text-white border-8 border-red-600" style="background-color: rgba(69, 10, 10, 0.95); display: none;">
        <div class="w-28 h-28 rounded-full flex items-center justify-center mb-6 border-4 border-red-500" style="background-color: rgba(220, 38, 38, 0.3);">
            <i class="fa-solid fa-triangle-exclamation text-6xl text-red-400"></i>
        </div>
        <h1 class="text-6xl font-black mb-6 text-red-200">[긴급 비상 방송]</h1>
        <p id="emergency-text" class="text-4xl font-black max-w-5xl leading-relaxed text-white p-8 rounded-2xl border border-red-500" style="background-color: rgba(153, 27, 27, 0.6);">
            비상 상황 발생 - 안내에 따라 대피하십시오.
        </p>
    </div>

    <!-- [0. 100% 전체 화면 전용 레이어 오버레이] -->
    <div id="fullscreen-overlay" class="hidden fixed inset-0 z-40 bg-black flex items-center justify-center overflow-hidden">
        <div id="fullscreen-display" class="w-full h-full flex items-center justify-center relative opacity-100"></div>
        <div class="absolute top-4 left-4 z-20 flex items-center gap-3">
            <span class="px-6 py-3 rounded-2xl text-xl font-black text-amber-300 border-2 border-amber-400 shadow-xl" style="background-color: rgba(15, 23, 42, 0.9);">
                <i class="fa-solid fa-expand text-amber-400 mr-2"></i>전체 화면 모드
            </span>
            <span id="fullscreenCounter" class="px-5 py-3 rounded-2xl text-xl font-bold text-gray-200 border border-gray-700 shadow-xl" style="background-color: rgba(15, 23, 42, 0.9);">
                1 / 1
            </span>
        </div>
        <div class="absolute bottom-0 left-0 right-0 h-2 bg-gray-900 z-20">
            <div id="fullscreenProgressBar" class="h-full bg-amber-400" style="width: 0%;"></div>
        </div>
    </div>

    <!-- [0-1. 셔틀 운행 지도 (운영설정 '셔틀 지도 표시' = ON 일 때만 보임)] -->
    <div id="shuttleBox" class="hidden relative w-full bg-black overflow-hidden" style="flex: 0 0 42%;">
        <iframe id="shuttleFrame" alt="셔틀 운행 지도" style="width: 100%; height: 100%; border: 0;"></iframe>
        <span class="absolute top-3 right-3 z-20 px-4 py-1.5 rounded-xl text-white font-black text-xl shadow-lg" style="background-color: rgba(14, 165, 233, 0.9);">
            <i class="fa-solid fa-bus mr-1"></i> 셔틀 운행
        </span>
    </div>

    <!-- [1. 상단 미디어 영역 (남는 높이를 모두 사용)] -->
    <div id="topContainer" class="relative w-full bg-black overflow-hidden flex items-center justify-center" style="flex: 1 1 auto; min-height: 0;">
        <div id="slide-display" class="w-full h-full flex items-center justify-center relative p-2 opacity-100">
            <div class="text-gray-400 text-2xl font-bold flex items-center gap-3">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-400"></i>
                미디어 콘텐츠를 불러오는 중...
            </div>
        </div>

        <div class="absolute top-4 left-4 z-20 flex flex-col items-start gap-3">
            <div class="flex items-center gap-3">
                <span id="mediaBadge" class="px-5 py-2.5 rounded-xl text-xl font-black text-blue-300 border border-blue-400/60 shadow-lg" style="background-color: rgba(15, 23, 42, 0.85);">
                    <span id="mediaTypeLabel">PLAYING</span>
                </span>
                <span id="mediaCounter" class="px-5 py-2.5 rounded-xl text-xl font-bold text-gray-200 border border-gray-700 shadow-lg" style="background-color: rgba(15, 23, 42, 0.85);">
                    0 / 0
                </span>
            </div>
        </div>

        <div id="slideQrBox" class="hidden absolute top-4 right-4 z-20 flex-col items-center bg-white p-2 rounded-xl shadow-2xl">
            <img id="slideQrImg" src="" alt="Slide QR" class="w-20 h-20 object-contain">
            <span class="text-[10px] text-gray-900 font-extrabold mt-1">상세 보기</span>
        </div>

        <div class="absolute bottom-0 left-0 right-0 h-1.5 bg-gray-800 z-20">
            <div id="progressBar" class="h-full bg-blue-400" style="width: 0%;"></div>
        </div>
    </div>

    <!-- [2. 하단 영역 : 헤드라인(고정) + 순환 패널] -->
    <div id="bottomContainer" class="relative w-full flex flex-col overflow-hidden" style="height: 36vh; flex: 0 0 auto; background-color: #020617;">

        <!-- 2-A. 실시간 주요 뉴스 (고정, 1분마다 갱신) -->
        <div id="headlinePanel" class="flex-none px-5 pt-3">
            <div class="flex items-center justify-between mb-2">
                <span class="px-5 py-1.5 text-white font-black text-2xl rounded-2xl border border-sky-500/50" style="background-color: rgba(56, 189, 248, 0.15);">
                    <i class="fa-solid fa-newspaper mr-1"></i> 실시간 주요 뉴스
                </span>
                <span class="text-lg text-white font-bold">Google 뉴스 · 1분마다 갱신</span>
            </div>
            <div id="headline-list" class="flex flex-col"></div>
        </div>

        <!-- 2-B. 순환 패널: 공지 → 일정 → 언론보도 → 주간 날씨 → 로고 -->
        <div id="rotatePanel" class="relative flex-1 min-h-0">

            <!-- 공지사항 -->
            <div id="noticeMode" class="absolute inset-0 p-4 flex flex-col justify-between mode-transition opacity-100 scale-100 pointer-events-auto">
                <div class="flex items-center justify-between mb-1">
                    <span class="px-6 py-2 text-white border-2 border-yellow-500 rounded-2xl text-3xl font-black flex items-center gap-3" style="background-color: rgba(245, 158, 11, 0.2);">
                        <i class="fa-solid fa-bullhorn text-2xl"></i> 복지관 공지사항
                    </span>
                    <div class="text-lg text-gray-300 font-bold flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-full bg-green-400"></span> 실시간 동기화
                    </div>
                </div>
                <div id="notice-list" class="flex-1 flex flex-col justify-center gap-2.5 my-0.5 overflow-hidden"></div>
            </div>

            <!-- 오늘의 일정 -->
            <div id="scheduleMode" class="absolute inset-0 p-4 flex flex-col justify-between mode-transition opacity-0 scale-95 pointer-events-none">
                <div class="flex items-center justify-between mb-1">
                    <span class="px-6 py-2 text-white border-2 border-emerald-500 rounded-2xl text-3xl font-black flex items-center gap-3" style="background-color: rgba(16, 185, 129, 0.2);">
                        <i class="fa-solid fa-calendar-day text-2xl"></i> 오늘의 복지관 일정
                    </span>
                    <div class="text-lg text-gray-300 font-bold flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-full bg-emerald-400"></span> 구글 캘린더 연동
                    </div>
                </div>
                <div id="schedule-list" class="flex-1 flex flex-col justify-center gap-2.5 my-0.5 overflow-hidden"></div>
            </div>

            <!-- 언론보도 -->
            <div id="pressMode" class="absolute inset-0 p-4 flex flex-col justify-between mode-transition opacity-0 scale-95 pointer-events-none">
                <div class="flex items-center justify-between mb-1">
                    <span class="px-6 py-2 text-white border-2 border-violet-400 rounded-2xl text-3xl font-black flex items-center gap-3" style="background-color: rgba(139, 92, 246, 0.2);">
                        <i class="fa-solid fa-newspaper text-2xl"></i> 복지관 언론보도
                    </span>
                    <div class="text-lg text-gray-300 font-bold flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-full bg-violet-400"></span> 언론에 소개된 복지관
                    </div>
                </div>
                <div id="press-list" class="flex-1 flex flex-col justify-center gap-2.5 my-0.5 overflow-hidden"></div>
            </div>

            <!-- 이번 주 날씨 (5일 예보) -->
            <div id="weatherMode" class="absolute inset-0 p-4 flex flex-col justify-between mode-transition opacity-0 scale-95 pointer-events-none">
                <div class="flex items-center justify-between mb-1">
                    <span class="px-6 py-2 text-white border-2 border-cyan-500 rounded-2xl text-3xl font-black flex items-center gap-3" style="background-color: rgba(6, 182, 212, 0.2);">
                        <i class="fa-solid fa-cloud-sun text-2xl"></i> 이번 주 날씨
                    </span>
                    <div class="text-lg text-gray-300 font-bold flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-full bg-cyan-400"></span> 거제시 5일 예보
                    </div>
                </div>
                <div id="week-list" class="flex-1 grid grid-cols-5 gap-3 my-2 items-stretch"></div>
            </div>

            <!-- 대형 로고 -->
            <div id="logoMode" class="absolute inset-0 p-4 flex items-center justify-center mode-transition opacity-0 scale-95 pointer-events-none">
                <img src="https://lh3.googleusercontent.com/d/1IV2uScHVsv0g4eQt2V33yjtMZewVY5-X"
                     alt="거제시종합사회복지관 로고"
                     class="object-contain logo-glow"
                     style="max-width: 85%; max-height: 85%;"
                     onerror="if(!this.getAttribute('data-retried')){this.setAttribute('data-retried','true');this.src='https://drive.google.com/uc?export=view&id=1IV2uScHVsv0g4eQt2V33yjtMZewVY5-X';}">
            </div>
        </div>
    </div>

    <!-- [3. 최하단 위젯바 (고정)] -->
    <div id="widgetBar" class="flex-none h-24 border-t border-gray-800 px-6 flex items-center justify-between gap-4" style="background-color: rgba(15, 23, 42, 0.95);">
        <div class="flex items-center gap-4 min-w-0">
            <div class="w-14 h-14 rounded-2xl bg-gray-800 flex items-center justify-center text-blue-400 border border-gray-700 shrink-0">
                <i class="fa-regular fa-clock text-3xl"></i>
            </div>
            <div class="flex flex-col justify-center min-w-0">
                <div class="flex items-center gap-2 whitespace-nowrap">
                    <span id="clockDate" class="text-lg text-gray-300 font-bold">날짜 로딩 중...</span>
                    <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-green-400"></span>
                    <span id="syncStatus" class="text-sm text-gray-400 font-bold">온라인</span>
                </div>
                <span id="clock-display" class="text-4xl font-black text-yellow-300 font-mono leading-none mt-1">00:00:00</span>
            </div>
        </div>

        <div id="weather-display" class="flex items-center gap-3 min-w-0">
            <i id="weatherIcon" class="fa-solid fa-sun text-yellow-400 text-4xl"></i>
            <div class="flex flex-col justify-center min-w-0">
                <span id="weatherStatus" class="text-lg text-gray-300 font-bold truncate">거제시 | 맑음</span>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="weatherTemp" class="text-4xl font-black text-white">--°C</span>
                    <span id="dustBadge" class="text-base font-black px-2.5 py-0.5 rounded-lg border bg-blue-500/30 text-blue-300 border-blue-400/50">
                        미세 보통
                    </span>
                </div>
            </div>
        </div>

        <div id="promoBox" class="hidden items-center gap-3 px-3 py-2 rounded-2xl border border-gray-700 bg-slate-800/60 min-w-0">
            <div id="promoText" class="text-base text-gray-100 font-bold leading-snug line-clamp-2" style="max-width: 150px;"></div>
            <img id="promoQr" alt="홍보 QR" class="w-16 h-16 bg-white p-1 rounded-lg object-contain shrink-0">
        </div>
    </div>

    <script>
        // ---------- 설정 ----------
        var DASHBOARD_REFRESH_MS = 60 * 1000;   // 공지·일정·날씨·뉴스·기관방문: 1분
        var SLIDE_REFRESH_MS = 5 * 60 * 1000;   // 상단 슬라이드(드라이브 파일): 5분
        var BOTTOM_HOLD_MS = 10 * 1000;         // 하단 패널 한 장면을 보여주는 시간
        var FADE_MS = 300;                      // 화면 전환 시 페이드 시간
        var HEADLINE_COUNT = 4;                 // 고정 헤드라인 개수
        // 셔틀 운행 지도 (GitHub Pages, shuttle-map 폴더). 저장소 설정에서 Pages를 켜야 열림
        var SHUTTLE_MAP_URL = 'https://ds5ezp.github.io/smalman/shuttle-map/';

        // 이미지 클래스 (전체 화면 / 일반 미디어)
        var FS_BG = 'absolute inset-0 w-full h-full object-cover filter blur-3xl opacity-50 scale-110 pointer-events-none';
        var FS_FG = 'relative z-10 max-w-full max-h-full object-contain shadow-2xl';
        var MEDIA_BG = 'absolute inset-0 w-full h-full object-cover filter blur-2xl opacity-40 scale-110 pointer-events-none';
        var MEDIA_FG = 'relative z-10 max-w-full max-h-full object-contain shadow-2xl rounded-lg';

        var state = {
            slides: [],
            slideIndex: 0,
            notices: [],
            schedules: [],
            news: [],
            press: [],
            forecast: [],
            systemMode: 'normal',
            operationalHours: "08:00 - 18:00",
            slideTimer: null
        };

        // 하단 순환 상태: 지금 패널(index)과 그 패널의 다음 페이지(page)
        var bottom = { index: 0, page: 0, timer: null };

        var welcomeState = {
            isWelcome: false,
            slides: [],
            index: 0,
            timer: null
        };

        // ---------- 공통 도구 ----------
        function triggerProgressBar(barElement, durationSec) {
            if (!barElement) return;
            barElement.style.animation = 'none';
            barElement.offsetHeight;
            barElement.style.animation = 'progressAnimation ' + durationSec + 's linear forwards';
        }

        // 아이콘 + 글자 요소 (서버에서 온 문자열을 HTML로 해석하지 않도록 텍스트 노드로 넣음)
        function makeIconText(tag, iconClass, text, className) {
            var el = document.createElement(tag);
            el.className = className;
            var icon = document.createElement('i');
            icon.className = iconClass;
            el.appendChild(icon);
            el.appendChild(document.createTextNode(' ' + (text || '')));
            return el;
        }

        function qrImageUrl(data, size) {
            return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' + encodeURIComponent(data);
        }

        // 하단 카드의 QR 박스 (공지사항·언론보도 공통)
        function makeQrBox(url, label, alt) {
            var box = document.createElement('div');
            box.className = 'flex flex-col items-center justify-center bg-white p-1 rounded-xl shrink-0 border-2 border-gray-300';
            var img = document.createElement('img');
            img.src = qrImageUrl(url, 150);
            img.alt = alt;
            img.className = 'w-16 h-16 object-contain';
            var text = document.createElement('span');
            text.className = 'text-sm text-gray-900 font-black mt-0.5';
            text.innerText = label;
            box.appendChild(img);
            box.appendChild(text);
            return box;
        }

        // 이미지 두 장(흐린 배경 + 선명한 앞)을 요소 안에 넣음
        function appendImagePair(container, src, bgClass, fgClass) {
            var bg = document.createElement('img');
            bg.className = bgClass;
            bg.src = src;
            var fg = document.createElement('img');
            fg.className = fgClass;
            fg.src = src;
            container.appendChild(bg);
            container.appendChild(fg);
        }

        // 요소를 페이드 아웃 → 내용 교체 → 페이드 인
        function fadeSwap(el, fill) {
            el.style.opacity = '0';
            setTimeout(function () {
                el.innerHTML = '';
                fill(el);
                el.style.opacity = '1';
            }, FADE_MS);
        }

        function getDriveFileId(url) {
            if (!url) return '';
            if (url.indexOf('id=') !== -1) return url.split('id=')[1].split('&')[0];
            if (url.indexOf('/d/') !== -1) return url.split('/d/')[1].split('/')[0].split('?')[0];
            var match = url.match(/[-\w]{25,}/);
            return match ? match[0] : '';
        }

        function getWeatherIconClass(iconCode) {
            if (!iconCode) return 'fa-solid fa-sun text-yellow-400';
            var code = String(iconCode).substring(0, 2);
            switch(code) {
                case '01': return 'fa-solid fa-sun text-yellow-400';
                case '02': return 'fa-solid fa-cloud-sun text-amber-300';
                case '03':
                case '04': return 'fa-solid fa-cloud text-gray-300';
                case '09':
                case '10': return 'fa-solid fa-cloud-showers-heavy text-blue-400';
                case '11': return 'fa-solid fa-cloud-bolt text-yellow-300';
                case '13': return 'fa-solid fa-snowflake text-sky-200';
                case '50': return 'fa-solid fa-smog text-slate-300';
                default: return 'fa-solid fa-sun text-yellow-400';
            }
        }

        // ---------- 상태 표시 / 운영시간 ----------
        function updateOnlineStatus(isOnline) {
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('syncStatus');
            if (!dot || !text) return;

            if (isOnline) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-green-400';
                text.innerText = '온라인';
                text.className = 'text-sm text-gray-400 font-bold';
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse';
                text.innerText = '오프라인';
                text.className = 'text-sm text-red-400 font-black';
            }
        }

        function checkSavingMode() {
            var savingOverlay = document.getElementById('saving-overlay');
            var savingTimeText = document.getElementById('saving-time-text');
            var emergencyOverlay = document.getElementById('emergency-overlay');

            if (state.systemMode === 'emergency') {
                if (savingOverlay) savingOverlay.style.display = 'none';
                if (emergencyOverlay) emergencyOverlay.style.display = 'flex';
                return;
            }

            if (emergencyOverlay) {
                emergencyOverlay.style.display = 'none';
            }

            var now = new Date();
            var curMinutes = now.getHours() * 60 + now.getMinutes();

            var hoursStr = state.operationalHours || "08:00 - 18:00";
            var parts = hoursStr.split("-");
            var startParts = (parts[0] || "08:00").trim().split(":");
            var endParts = (parts[1] || "18:00").trim().split(":");

            var startMinutes = parseInt(startParts[0], 10) * 60 + parseInt(startParts[1] || 0, 10);
            var endMinutes = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1] || 0, 10);

            if (curMinutes < startMinutes || curMinutes >= endMinutes) {
                if (savingOverlay) {
                    savingOverlay.style.display = 'flex';
                    if (savingTimeText) {
                        savingTimeText.innerText = '운영 시간 : ' + hoursStr;
                    }
                }
            } else {
                if (savingOverlay) savingOverlay.style.display = 'none';
            }
        }

        // ---------- 서버 통신 ----------
        function refreshDashboardData() {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(onDashboardDataLoaded)
                    .withFailureHandler(function(err) {
                        console.error('대시보드 데이터 연동 에러:', err);
                        updateOnlineStatus(false);
                    })
                    .getDashboardData();
            } else {
                updateOnlineStatus(navigator.onLine);
            }
        }

        function refreshSlideData() {
            if (welcomeState.isWelcome) return;

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function(slides) {
                        updateOnlineStatus(true);
                        if (slides && Array.isArray(slides) && slides.length > 0) {
                            state.slides = slides;
                            if (state.slideIndex >= state.slides.length) {
                                state.slideIndex = 0;
                            }
                            if (!state.slideTimer) {
                                showCurrentSlide();
                            }
                        }
                    })
                    .withFailureHandler(function(err) {
                        console.error('슬라이드 데이터 연동 에러:', err);
                        updateOnlineStatus(false);
                    })
                    .getSlideData();
            }
        }

        function onDashboardDataLoaded(data) {
            if (!data) {
                updateOnlineStatus(false);
                return;
            }

            updateOnlineStatus(true);

            state.systemMode = (data.systemMode === 'emergency') ? 'emergency' : 'normal';
            if (data.operationalHours) {
                state.operationalHours = data.operationalHours;
            }

            // 비상 문구는 기관방문 환영 화면 중에도 갱신 (아래 환영 분기에서 return 되기 전에 처리)
            var emergencyText = document.getElementById('emergency-text');
            if (emergencyText) {
                emergencyText.innerText = data.emergencyMsg || '비상 상황 발생';
            }
            checkSavingMode();

            if (data.welcomeInfo && data.welcomeInfo.isWelcome && data.welcomeInfo.slides.length > 0) {
                clearTimeout(state.slideTimer);
                state.slideTimer = null;
                welcomeState.isWelcome = true;
                welcomeState.slides = data.welcomeInfo.slides;
                renderWelcomeSlides();
                return;
            } else if (welcomeState.isWelcome) {
                welcomeState.isWelcome = false;
                clearTimeout(welcomeState.timer);
                document.getElementById('fullscreen-overlay').classList.add('hidden');
                showCurrentSlide();
            }

            if (data.weather) renderWeather(data.weather);
            renderPromo(data.promo || null);
            renderShuttleMap(!!data.shuttleMap);

            if (Array.isArray(data.notices)) state.notices = data.notices;
            if (Array.isArray(data.schedule)) state.schedules = data.schedule;
            if (Array.isArray(data.news)) state.news = data.news;
            if (Array.isArray(data.press)) state.press = data.press;
            if (Array.isArray(data.forecast)) state.forecast = data.forecast;

            renderHeadlines();
            stepBottom();
        }

        function renderWeather(weather) {
            var dustText = weather.dust || '보통';
            var dustClass = 'bg-blue-500/30 text-blue-300 border-blue-400/50';
            if (dustText === '보통') {
                dustClass = 'bg-green-500/30 text-green-300 border-green-400/50';
            } else if (dustText === '나쁨') {
                dustClass = 'bg-amber-500/30 text-amber-300 border-amber-400/50';
            } else if (dustText === '매우나쁨') {
                dustClass = 'bg-red-500/30 text-red-300 border-red-400/50';
            }

            var icon = document.getElementById('weatherIcon');
            if (icon) icon.className = getWeatherIconClass(weather.icon || '01d') + ' text-4xl';
            var status = document.getElementById('weatherStatus');
            if (status) status.innerText = '거제시 | ' + (weather.status || '맑음');
            var temp = document.getElementById('weatherTemp');
            if (temp) temp.innerText = weather.temp || '--°C';
            var dust = document.getElementById('dustBadge');
            if (dust) {
                dust.className = 'text-base font-black px-2.5 py-0.5 rounded-lg border ' + dustClass;
                dust.innerText = '미세 ' + dustText;

        // 셔틀 지도: 켜면 위쪽에 나오고, 끄면 숨기면서 주소도 지워서 지도 페이지가 돌지 않게 함
        function renderShuttleMap(on) {

        // 위젯바 오른쪽 홍보 박스 (운영설정 값이 없으면 숨김)

        // ---------- 기관방문 환영 (전체 화면) ----------
        function renderWelcomeSlides() {
            clearTimeout(welcomeState.timer);

            var fsOverlay = document.getElementById('fullscreen-overlay');
            var fsContainer = document.getElementById('fullscreen-display');
            var fsCounter = document.getElementById('fullscreenCounter');
            var fsProgressBar = document.getElementById('fullscreenProgressBar');

            if (!welcomeState.isWelcome || welcomeState.slides.length === 0) {
                if (state.systemMode !== 'emergency') fsOverlay.classList.add('hidden');
                return;
            }

            fsOverlay.classList.remove('hidden');

            var slide = welcomeState.slides[welcomeState.index];
            var shownImg = fsContainer.querySelector('img.relative');

            // 환영 이미지가 한 장뿐이고 이미 보이고 있으면 다시 그리지 않음
            if (welcomeState.slides.length === 1 && shownImg && shownImg.src === slide.path) {
                fsCounter.innerText = '방문 환영 (1 / 1)';
                fsProgressBar.style.animation = 'none';
                fsProgressBar.style.width = '100%';
                return;
            }

            var durationMs = slide.duration || 6000;
            fsCounter.innerText = '방문 환영 (' + (welcomeState.index + 1) + ' / ' + welcomeState.slides.length + ')';
            triggerProgressBar(fsProgressBar, durationMs / 1000);
            fadeSwap(fsContainer, function (el) { appendImagePair(el, slide.path, FS_BG, FS_FG); });

            if (welcomeState.slides.length > 1) {
                welcomeState.timer = setTimeout(function() {
                    welcomeState.index = (welcomeState.index + 1) % welcomeState.slides.length;
                    renderWelcomeSlides();
                }, durationMs);

        // 패널 목록. items: 보여줄 데이터, pageSize: 한 번에 넘기는 개수, render(items, from): 그리기
        // skipWhenEmpty: 데이터가 없으면 안내 없이 바로 다음 패널로 넘김 (언론보도, 날씨)
        var BOTTOM_PANELS = [
            { id: 'noticeMode', items: function () { return state.notices; }, pageSize: 2, render: renderNoticeCards,
              empty: function () { emptyMessage('notice-list', '등록된 공지사항이 없습니다.'); } },
            { id: 'scheduleMode', items: function () { return state.schedules; }, pageSize: 2, render: renderScheduleCards,
              empty: function () { emptyMessage('schedule-list', '오늘 예정된 복지관 일정이 없습니다.'); } },
            { id: 'pressMode', items: function () { return state.press; }, pageSize: 2, render: renderPressCards,
              skipWhenEmpty: true },
            { id: 'weatherMode', items: function () { return state.forecast; }, pageSize: 5,
              render: function (items) { renderWeekCards(items); }, skipWhenEmpty: true },
            { id: 'logoMode', logo: true }
        ];

        function setPanelVisible(el, on) {
            if (!el) return;
            el.classList.toggle('opacity-100', on);
            el.classList.toggle('scale-100', on);
            el.classList.toggle('pointer-events-auto', on);
            el.classList.toggle('opacity-0', !on);
            el.classList.toggle('scale-95', !on);
            el.classList.toggle('pointer-events-none', !on);
        }

        // 패널 제목 오른쪽에 현재 묶음 표시 (예: 2 / 3). 묶음이 하나뿐이거나 내용이 없으면 숨김
        function setPageCounter(panelId, current, total) {
            var panel = document.getElementById(panelId);
            var right = panel && panel.firstElementChild && panel.firstElementChild.lastElementChild;
            if (!right) return;
            var counter = right.querySelector('[data-page]');
            if (!counter) {
                counter = document.createElement('span');
                counter.setAttribute('data-page', '');
                counter.className = 'ml-2 px-3 py-0.5 rounded-lg bg-white/15 text-white font-black text-xl';
                right.appendChild(counter);
            }
            counter.innerText = total > 1 ? current + ' / ' + total : '';
            counter.style.display = total > 1 ? '' : 'none';
        }

        // 하단 목록이 바뀔 때: 살짝 흐려지며 내려갔다가, 새 내용이 아래에서 올라오며 나타남
        function swapBox(panelId, render) {
            var panel = document.getElementById(panelId);
            var box = panel && panel.lastElementChild;
            if (!box) return render();
            box.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            box.style.opacity = '0';
            box.style.transform = 'translateY(14px)';
            setTimeout(function () {
                render();
                box.style.transition = 'none';
                box.style.transform = 'translateY(-14px)';
                box.offsetHeight;
                box.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                box.style.opacity = '1';
                box.style.transform = 'none';
            }, 400);
        }

        function runBottom(ms, next) {
            clearTimeout(bottom.timer);
            bottom.timer = setTimeout(next, ms);
        }

        // 지금 패널의 현재 페이지를 그리고, 다음 페이지 또는 다음 패널로 넘어가는 시간을 맞춤
        function stepBottom() {
            BOTTOM_PANELS.forEach(function (p, i) {
                setPanelVisible(document.getElementById(p.id), i === bottom.index);
            });

            var panel = BOTTOM_PANELS[bottom.index];
            if (panel.logo) return runBottom(BOTTOM_HOLD_MS, nextBottomPanel);

            var items = panel.items();
            if (items.length === 0) {
                if (panel.skipWhenEmpty) return nextBottomPanel();
                swapBox(panel.id, function () {
                    panel.empty();
                    setPageCounter(panel.id, 0, 0);
                });
                return runBottom(BOTTOM_HOLD_MS, nextBottomPanel);
            }

            // 데이터가 줄어서 이 페이지가 없어진 경우 다음 패널로
            if (bottom.page >= items.length) return nextBottomPanel();

            var from = bottom.page;
            swapBox(panel.id, function () {
                panel.render(items, from);
                setPageCounter(panel.id, Math.floor(from / panel.pageSize) + 1, Math.ceil(items.length / panel.pageSize));
            });
            bottom.page += panel.pageSize;
            runBottom(BOTTOM_HOLD_MS, bottom.page < items.length ? stepBottom : nextBottomPanel);
        }

        function nextBottomPanel() {
            bottom.page = 0;
            bottom.index = (bottom.index + 1) % BOTTOM_PANELS.length;
            stepBottom();
        }

        // ---------- 상단 미디어 ----------
        function showCurrentSlide() {
            clearTimeout(state.slideTimer);

            if (welcomeState.isWelcome) return;

            var container = document.getElementById('slide-display');
            var fsOverlay = document.getElementById('fullscreen-overlay');

            if (state.slides.length === 0) {
                if (container) {
                    container.innerHTML = '<div class="text-gray-400 text-2xl font-bold flex items-center gap-3"><i class="fa-solid fa-circle-notch fa-spin text-blue-400"></i> 콘텐츠를 불러오는 중입니다...</div>';
                }
                return;
            }

            var slide = state.slides[state.slideIndex] || state.slides[0];
            var durationMs = (slide.duration && slide.duration > 0) ? Number(slide.duration) : 6000;
            var type = String(slide.type || 'IMAGE').toUpperCase().trim();

            if (type === 'FULLSCREEN') {
                renderFullscreenSlide(slide, durationMs);
            } else {
                fsOverlay.classList.add('hidden');
                renderMediaSlide(slide, type, durationMs);
            }

            state.slideTimer = setTimeout(nextSlide, durationMs);
        }

        function renderFullscreenSlide(slide, durationMs) {
            document.getElementById('fullscreen-overlay').classList.remove('hidden');
            document.getElementById('fullscreenCounter').innerText = (state.slideIndex + 1) + ' / ' + state.slides.length;
            triggerProgressBar(document.getElementById('fullscreenProgressBar'), durationMs / 1000);

            var fsContainer = document.getElementById('fullscreen-display');
            fadeSwap(fsContainer, function (el) { appendImagePair(el, slide.path, FS_BG, FS_FG); });
        }

        function renderMediaSlide(slide, type, durationMs) {
            var container = document.getElementById('slide-display');
            var mediaCounter = document.getElementById('mediaCounter');
            var mediaTypeLabel = document.getElementById('mediaTypeLabel');
            var slideQrBox = document.getElementById('slideQrBox');
            var slideQrImg = document.getElementById('slideQrImg');
            var rawPath = String(slide.path || '').trim();

            mediaCounter.innerText = (state.slideIndex + 1) + ' / ' + state.slides.length;
            triggerProgressBar(document.getElementById('progressBar'), durationMs / 1000);

            // 행사·로고 화면은 자체 안내가 있어서 우측 상단 QR을 띄우지 않음
            if (type !== 'EVENT_POST' && type !== 'LOGO_SLIDE' && slide.qr && slide.qr !== '(선택)' && slide.qr.length > 5) {
                slideQrImg.src = qrImageUrl(slide.qr, 150);
                slideQrBox.classList.remove('hidden');
            } else {
                slideQrBox.classList.add('hidden');
            }

            if (!container) return;

            fadeSwap(container, function (el) {
                if (type === 'LOGO_SLIDE') {
                    mediaTypeLabel.innerText = '기관 소개';
                    renderLogoSlide(el, rawPath);
                } else if (type === 'EVENT_POST') {
                    mediaTypeLabel.innerText = '행사 소식';
                    renderEventSlide(el, slide, rawPath);
                } else if (type === 'SLIDES') {
                    mediaTypeLabel.innerText = 'SLIDES';
                    renderSlidesEmbed(el, rawPath);
                } else if (type === 'VIDEO') {
                    mediaTypeLabel.innerText = 'VIDEO';
                    renderVideo(el, rawPath);
                } else {
                    // WEBZINE, IMAGE, 그 밖의 타입은 모두 이미지로 보여줌
                    mediaTypeLabel.innerText = (type === 'WEBZINE' || type === 'IMAGE') ? (slide.title || type) : 'IMAGE';
                    appendImagePair(el, rawPath, MEDIA_BG, MEDIA_FG);
                }
            });
        }

        function renderLogoSlide(el, src) {
            var wrapper = document.createElement('div');
            wrapper.className = 'w-full h-full flex flex-col items-center justify-center p-8 bg-slate-950/95 relative';

            var bg = document.createElement('img');
            bg.className = 'absolute inset-0 w-full h-full object-cover filter blur-3xl opacity-30 scale-110 pointer-events-none';
            bg.src = src;

            var logo = document.createElement('img');
            logo.className = 'relative z-10 object-contain logo-glow';
            logo.style.cssText = 'max-width: 65%; max-height: 65%;';
            logo.src = src;

            wrapper.appendChild(bg);
            wrapper.appendChild(logo);
            el.appendChild(wrapper);
        }

        function eventPhotoBox(url) {
            var box = document.createElement('div');
            box.className = 'relative overflow-hidden rounded-xl bg-black border border-gray-800 shadow-xl flex items-center justify-center';

            var bg = document.createElement('img');
            bg.className = 'absolute inset-0 w-full h-full object-cover filter blur-2xl opacity-40 scale-110 pointer-events-none';
            bg.src = url;

            var img = document.createElement('img');
            img.className = 'relative z-10 max-w-full max-h-full object-contain rounded-lg shadow-md img-fade-transition';
            img.src = url;

            box.appendChild(bg);
            box.appendChild(img);
            return box;
        }

        // 행사 소식: 왼쪽 사진(최대 3장), 오른쪽 글과 QR
        function renderEventSlide(el, slide, rawPath) {
            var wrapper = document.createElement('div');
            wrapper.id = 'eventWrapper';
            wrapper.className = 'w-full h-full flex flex-row items-center justify-between p-4 gap-6 bg-slate-950/90';

            var imgList = slide.images || (rawPath ? [rawPath] : []);

            // 사진 칸: 비율을 읽은 뒤 layoutEventPhotos 가 채움
            var photoCol = document.createElement('div');
            photoCol.className = 'w-1/2 h-full min-h-0 flex items-center justify-center';
            if (imgList.length > 0) wrapper.appendChild(photoCol);

            var textBox = document.createElement('div');
            textBox.className = (imgList.length > 0 ? 'w-1/2' : 'w-full') + ' h-full flex flex-col justify-between p-7 bg-slate-900/90 rounded-2xl border border-amber-500/50 shadow-2xl overflow-hidden';

            var topHeader = document.createElement('div');
            topHeader.className = 'flex flex-col gap-3.5 flex-1 min-h-0 overflow-hidden';

            var badgeBox = document.createElement('div');
            badgeBox.className = 'flex items-center justify-between shrink-0';

            var badgeText = '<i class="fa-solid fa-camera-retro"></i> 복지관 행사 소식';
            if (slide.imgTotal && slide.imgTotal > 1) {
                badgeText += ' (' + slide.imgIndex + '/' + slide.imgTotal + ')';
            }
            var badge = document.createElement('span');
            badge.className = 'px-4 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-400/50 text-2xl font-black flex items-center gap-2';
            badge.innerHTML = badgeText;

            var dateEl = document.createElement('span');
            dateEl.className = 'text-2xl text-gray-300 font-bold';
            dateEl.innerText = slide.date || '';

            badgeBox.appendChild(badge);
            badgeBox.appendChild(dateEl);

            var titleEl = document.createElement('h2');
            titleEl.className = 'text-5xl font-black text-amber-300 leading-snug mt-1 shrink-0';
            titleEl.innerText = slide.title || '';

            var descEl = document.createElement('p');
            descEl.className = 'text-3xl text-gray-100 leading-relaxed font-normal mt-2 flex-1 min-h-0 overflow-hidden';
            descEl.innerText = slide.desc || '';

            topHeader.appendChild(badgeBox);
            topHeader.appendChild(titleEl);
            topHeader.appendChild(descEl);
            textBox.appendChild(topHeader);

            if (slide.qr && slide.qr.length > 5) {
                var bottomQrBox = document.createElement('div');
                bottomQrBox.className = 'flex items-center justify-between pt-3 border-t border-gray-800 mt-auto shrink-0';

                var qrInfoText = document.createElement('span');
                qrInfoText.className = 'text-2xl text-amber-200/90 font-bold leading-snug pr-3';
                qrInfoText.innerText = '스마트폰으로 QR을 스캔하여 자세한 소식을 확인해보세요';

                var qrImgEl = document.createElement('img');
                qrImgEl.src = qrImageUrl(slide.qr, 200);
                qrImgEl.className = 'w-28 h-28 bg-white p-1 rounded-xl shadow-lg shrink-0 object-contain';

                bottomQrBox.appendChild(qrInfoText);
                bottomQrBox.appendChild(qrImgEl);
                textBox.appendChild(bottomQrBox);
            }

            wrapper.appendChild(textBox);
            el.appendChild(wrapper);
            fitSentences(descEl, slide.desc || '');
            if (imgList.length > 0) {
                loadRatios(imgList).then(function (ratios) {
                    var fill = layoutEventPhotos(photoCol, imgList, ratios);
                    if (fill < 0.6) {
                        // 사진이 너무 작으면 제목과 본문만 넓게 보여줌
                        photoCol.remove();
                        textBox.classList.replace('w-1/2', 'w-full');
                        // 칸이 짧을 때 제목이 잘리지 않도록 글자를 줄이고 두 줄까지만 보여줌
                        titleEl.className = 'text-4xl font-black text-amber-300 leading-snug mt-1 shrink-0 line-clamp-2';
                        fitSentences(descEl, slide.desc || '');
                    }
                });
            }
        }

        // 사진들의 가로÷세로 비율을 읽음 (못 읽거나 3초가 넘으면 4:3으로 가정)
        function loadRatios(urls) {
            return Promise.all(urls.map(function (url) {
                return new Promise(function (resolve) {
                    var done = false;
                    var finish = function (ratio) {
                        if (done) return;
                        done = true;
                        resolve(ratio);
                    };
                    var img = new Image();
                    img.onload = function () {
                        finish(img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 4 / 3);
                    };
                    img.onerror = function () { finish(4 / 3); };
                    img.src = url;
                    setTimeout(function () { finish(4 / 3); }, 3000);
                });
            }));
        }

        // 사진 비율에 맞춰 칸을 채움: 사진을 한 줄 또는 여러 줄로 묶는 모든 경우를 비교해서,
        // 칸 높이에 가장 맞고 잘리지 않는 배치를 고름. 가로 사진은 넓게, 세로 사진은 좁게 놓임
        function layoutEventPhotos(container, urls, ratios) {
            var W = container.clientWidth;
            var H = container.clientHeight;
            var GAP = 8;
            if (!W || !H) return;

            var n = urls.length;
            var best = null;
            // 비트마스크로 사진 사이를 끊는 모든 경우를 만들어 봄 (사진 최대 3장이라 경우의 수가 적음)
            for (var mask = 0; mask < (1 << (n - 1)); mask++) {
                var rows = [];
                var cur = [];
                for (var i = 0; i < n; i++) {
                    cur.push(i);
                    if (i === n - 1 || (mask & (1 << i))) {
                        rows.push(cur);
                        cur = [];
                    }
                }

                var total = GAP * (rows.length - 1);
                var sized = rows.map(function (row) {
                    var sum = row.reduce(function (s, k) { return s + ratios[k]; }, 0);
                    var h = (W - GAP * (row.length - 1)) / sum;
                    total += h;
                    return { items: row, h: h };
                });

                // 칸을 넘기는 배치는 벌점을 크게 줌 (넘치면 전체를 줄여야 해서 작아짐)
                var score = total <= H ? (H - total) : (total - H) * 3;
                if (!best || score < best.score) best = { score: score, rows: sized, total: total };
            }

            // 사진 묶음이 칸 높이의 60%도 못 채우면 사진을 그리지 않음 (호출한 쪽이 글만 보여줌)
            var fill = best.total / H;
            if (fill < 0.6) return fill;

            var scale = best.total > H ? H / best.total : 1;
            container.innerHTML = '';
            var stack = document.createElement('div');
            stack.className = 'flex flex-col items-center';
            stack.style.gap = GAP + 'px';

            best.rows.forEach(function (row) {
                var rowEl = document.createElement('div');
                rowEl.className = 'flex';
                rowEl.style.gap = GAP + 'px';
                var h = row.h * scale;
                row.items.forEach(function (k) {
                    var tile = eventPhotoBox(urls[k]);
                    tile.style.width = (ratios[k] * h) + 'px';
                    tile.style.height = h + 'px';
                    rowEl.appendChild(tile);
                });
                stack.appendChild(rowEl);
            });
            container.appendChild(stack);
            return fill;
        }

        // 본문이 칸을 넘으면 문장 단위로 줄여서, 문장 중간에서 잘리지 않게 함
        function fitSentences(el, text) {
            if (!el.clientHeight) {
                el.innerText = text;
                return;
            }
            var sentences = (text.match(/[^.!?]+[.!?]*/g) || [text])
                .map(function (s) { return s.trim(); })
                .filter(Boolean);
            var n = sentences.length;
            el.innerText = sentences.join(' ');
            while (el.scrollHeight > el.clientHeight && n > 1) {
                n--;
                el.innerText = sentences.slice(0, n).join(' ') + ' …';
            }
        }

        function renderSlidesEmbed(el, rawPath) {
            var embedUrl = rawPath;
            if (rawPath.indexOf('/pub?') !== -1) {
                embedUrl = rawPath.replace('/pub?', '/embed?');
            } else if (rawPath.indexOf('/presentation/d/') !== -1 && rawPath.indexOf('/embed') === -1) {
                embedUrl = rawPath.split('/edit')[0].split('/pub')[0] + '/embed?start=true&loop=true&delayms=3000';
            }
            if (embedUrl.indexOf('rm=minimal') === -1) {
                embedUrl += (embedUrl.indexOf('?') !== -1 ? '&' : '?') + 'rm=minimal';
            }

            var iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.className = 'w-full h-full border-none';
            iframe.allow = 'autoplay; encrypted-media';
            el.appendChild(iframe);
        }

        function renderVideo(el, rawPath) {
            var isDrive = (rawPath.indexOf('drive.google.com') !== -1 || rawPath.indexOf('googleusercontent.com') !== -1);
            var fileId = isDrive ? getDriveFileId(rawPath) : '';

            if (isDrive && fileId) {
                var iframe = document.createElement('iframe');
                iframe.src = 'https://drive.google.com/file/d/' + fileId + '/preview?autoplay=1';
                iframe.className = 'w-full h-full border-none';
                iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
                el.appendChild(iframe);
                return;
            }

            var video = document.createElement('video');
            video.src = rawPath;
            video.autoplay = true;
            video.muted = true;
            video.playsInline = true;
            video.loop = true;
            video.className = 'max-w-full max-h-full object-contain';
            video.onerror = function() {
                console.error("동영상 재생 실패 주소:", rawPath);
            };
            el.appendChild(video);
            video.play().catch(function(e) {
                console.warn("자동재생 실패:", e);
            });
        }

        function nextSlide() {
            if (state.slides.length === 0) return;
            state.slideIndex = (state.slideIndex + 1) % state.slides.length;
            showCurrentSlide();
        }

        // ---------- 시계 ----------
        function startClock() {
            function updateClock() {
                var now = new Date();
                var days = ['일', '월', '화', '수', '목', '금', '토'];
                var pad = function (n) { return String(n).padStart(2, '0'); };

                document.getElementById('clockDate').innerText =
                    now.getFullYear() + '년 ' + pad(now.getMonth() + 1) + '월 ' + pad(now.getDate()) + '일 (' + days[now.getDay()] + ')';
                document.getElementById('clock-display').innerText =
                    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

                checkSavingMode();
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        // ---------- 시작 ----------
        (function initSignage() {
            startClock();

            window.addEventListener('online', function() { updateOnlineStatus(true); });
            window.addEventListener('offline', function() { updateOnlineStatus(false); });

            stepBottom();

            refreshDashboardData();
            refreshSlideData();

            setInterval(refreshDashboardData, DASHBOARD_REFRESH_MS);
            setInterval(refreshSlideData, SLIDE_REFRESH_MS);
        })();
    </script>
</body>
</html>
