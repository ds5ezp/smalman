<!--
  복지관 통합 관리 대시보드 공통 스타일 (토스 스타일)
  - Index.html 에서 <?!= include('Style'); ?> 로 불러옴
  - 2단계 이후 메뉴(각 실 사이니지, 공유트럭, 배움터, 셔틀)도 이 파일의 색/모양을 그대로 씀
  - 색은 아래 :root 변수만 바꾸면 전체에 반영됨

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --t-bg: #f2f4f6;
    --t-card: #ffffff;
    --t-text: #191f28;
    --t-text2: #4e5968;
    --t-text3: #8b95a1;
    --t-line: #e5e8eb;
    --t-fill: #f2f4f6;
    --t-fill-hover: #e5e8eb;
    --t-blue: #3182f6;
    --t-blue-hover: #1b64da;
    --t-blue-weak: #e8f3ff;
    --t-red: #f04452;
    --t-red-weak: #ffeeee;
    --t-green: #03b26c;
    --t-green-weak: #e5f8ef;
    --t-orange: #fe9800;
    --t-orange-weak: #fff3e0;
    --t-radius: 20px;
    --t-radius-sm: 12px;

    --bs-body-font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    --bs-body-color: var(--t-text);
    --bs-body-bg: var(--t-bg);
    --bs-border-color: var(--t-line);
    --bs-primary: var(--t-blue);
    --bs-link-color: var(--t-blue);
    --bs-link-hover-color: var(--t-blue-hover);
    --bs-secondary-color: var(--t-text3);
  }

  body { background: var(--t-bg); color: var(--t-text); font-family: var(--bs-body-font-family); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  a { color: var(--t-blue); text-decoration: none; }
  a:hover { color: var(--t-blue-hover); }
  .text-muted { color: var(--t-text3) !important; }
  .small, small { font-size: .875rem; }
  h4 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  h6 { font-size: 1.05rem; font-weight: 700; color: var(--t-text); }

  /* ---------- 상단 바 ---------- */
  .app-header { position: sticky; top: 0; z-index: 1020; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(255, 255, 255, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--t-line); }
  .app-header .brand { font-weight: 700; font-size: 1.1rem; color: var(--t-text); display: flex; align-items: center; gap: .5rem; }
  .app-header .brand i { color: var(--t-blue); }
  .app-header .user { font-size: .8rem; color: var(--t-text3); }
  .app-header .user-box { display: flex; align-items: center; gap: 12px; }
  .app-header .user-text { text-align: right; line-height: 1.25; }
  .app-header .user-name { font-size: .9rem; font-weight: 700; color: var(--t-text); }
  .app-header .user-name:empty { display: none; }

  /* ---------- 왼쪽 메뉴 ---------- */
  .sidebar { width: 232px; min-height: calc(100vh - 60px); background: var(--t-card); border-right: 1px solid var(--t-line); padding: 16px 0; }
  .sidebar .sidebar-title { padding: 4px 24px 8px; font-size: .8rem; font-weight: 600; color: var(--t-text3); }
  .sidebar .module { display: flex; align-items: center; gap: .7rem; padding: .75rem 1rem; margin: 2px 12px; border-radius: var(--t-radius-sm); color: var(--t-text2); font-weight: 600; font-size: .95rem; white-space: nowrap; }
  .sidebar .module i { font-size: 1.1rem; color: var(--t-text3); }
  .sidebar .module:hover { background: var(--t-fill); color: var(--t-text); }
  .sidebar .module.active { background: var(--t-blue-weak); color: var(--t-blue); font-weight: 700; }
  .sidebar .module.active i { color: var(--t-blue); }
  .sidebar .module.disabled { color: #b0b8c1; pointer-events: none; }
  .sidebar .module.disabled i { color: #c9cfd6; }
  .sidebar .soon { margin-left: auto; font-size: .7rem; font-weight: 600; color: var(--t-text3); background: var(--t-fill); padding: 2px 8px; border-radius: 999px; }
  main { flex: 1; min-width: 0; max-width: 1400px; }

  /* ---------- 카드 ---------- */

  .card.p-3 { padding: 22px !important; }
  .stat-label { font-size: .85rem; font-weight: 500; color: var(--t-text3); }
  .stat-value { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }

  /* ---------- 탭 (밑줄형) ---------- */
  .nav-tabs { border-bottom: 1px solid var(--t-line); gap: 4px; }

  .nav-tabs .nav-link:hover { color: var(--t-text2); border: none; }
  .nav-tabs .nav-link.active { color: var(--t-text); background: none; box-shadow: inset 0 -2px 0 var(--t-text); }
  .nav-tabs .nav-link i { display: none; }

  /* ---------- 버튼 ---------- */
  .btn { border: none; border-radius: var(--t-radius-sm); font-weight: 600; padding: .6rem 1.1rem; transition: background-color .15s, color .15s; }
  .btn-sm { border-radius: 10px; padding: .4rem .8rem; font-size: .85rem; }
  .btn:focus-visible { box-shadow: 0 0 0 3px rgba(49, 130, 246, .3); }
  .btn-primary { background: var(--t-blue); color: #fff; }
  .btn-primary:hover, .btn-primary:active { background: var(--t-blue-hover) !important; color: #fff; }
  .btn-outline-primary { background: var(--t-blue-weak); color: var(--t-blue); }
  .btn-outline-primary:hover, .btn-outline-primary:active { background: #c9e2ff !important; color: var(--t-blue-hover) !important; }
  .btn-danger { background: var(--t-red); color: #fff; }
  .btn-danger:hover { background: #d22030 !important; color: #fff; }
  .btn-outline-danger { background: var(--t-red-weak); color: var(--t-red); }
  .btn-outline-danger:hover, .btn-outline-danger:active { background: #ffd4d6 !important; color: var(--t-red) !important; }
  /* 회색 배경 위에서는 흰 버튼, 흰 카드/창 안에서는 회색 버튼 */
  .btn-light, .btn-outline-secondary, .btn-outline-dark { background: #fff; color: var(--t-text2); border: none !important; }
  .card .btn-light, .card .btn-outline-secondary, .card .btn-outline-dark,
  .modal .btn-light, .modal .btn-outline-secondary { background: var(--t-fill); }
  .btn-light:hover, .btn-outline-secondary:hover, .btn-outline-dark:hover,
  .btn-outline-secondary.active, .btn-outline-secondary:active { background: var(--t-fill-hover) !important; color: var(--t-text) !important; }
  .btn-dark, .btn-outline-dark.active { background: var(--t-text); color: #fff; }
  .btn-dark:hover { background: #333d4b !important; color: #fff; }

  .btn-group > .btn { border-radius: 10px !important; margin-right: 4px; }

  /* ---------- 배지 / 상태 표시 ---------- */
  .badge { font-weight: 600; padding: .35em .65em; border-radius: 8px; }
  .text-bg-success { background: var(--t-green-weak) !important; color: var(--t-green) !important; }
  .text-bg-warning { background: var(--t-orange-weak) !important; color: #e07a00 !important; }
  .text-bg-danger { background: var(--t-red-weak) !important; color: var(--t-red) !important; }
  .text-bg-primary, .text-bg-info { background: var(--t-blue-weak) !important; color: var(--t-blue) !important; }
  .text-bg-secondary, .text-bg-light { background: var(--t-fill) !important; color: var(--t-text2) !important; border: none !important; }
  .text-success { color: var(--t-green) !important; }
  .text-danger { color: var(--t-red) !important; }
  .text-primary { color: var(--t-blue) !important; }
  .mode-pill { display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .9rem; border-radius: 999px; font-weight: 700; font-size: 1.05rem; }

  /* ---------- 입력 ---------- */
  .form-control, .form-select { background-color: var(--t-fill); border: 1px solid transparent; border-radius: var(--t-radius-sm); padding: .6rem .85rem; color: var(--t-text); }
  .form-control-sm { border-radius: 10px; padding: .4rem .7rem; }
  .form-control:focus, .form-select:focus { background-color: #fff; border-color: var(--t-blue); box-shadow: 0 0 0 3px rgba(49, 130, 246, .15); }
  .form-label { font-weight: 600; color: var(--t-text2); margin-bottom: .35rem; }
  .form-check-input:checked { background-color: var(--t-blue); border-color: var(--t-blue); }
  .form-check-input:focus { box-shadow: 0 0 0 3px rgba(49, 130, 246, .15); }
  .input-group > .form-control { border-radius: var(--t-radius-sm) 0 0 var(--t-radius-sm); }
  .input-group > .btn { border-radius: 0 var(--t-radius-sm) var(--t-radius-sm) 0; }

  /* ---------- 표 ---------- */
  .table { --bs-table-bg: transparent; color: var(--t-text); margin-bottom: 0; }
  .table thead th { font-size: .8rem; font-weight: 600; color: var(--t-text3); border-bottom: 1px solid var(--t-line); padding: .6rem .5rem; }
  .table td { border-bottom: 1px solid #f2f4f6; padding: .75rem .5rem; }
  .table tbody tr:last-child td { border-bottom: none; }
  .table tbody tr:hover td { background: #f9fafb; }
  .loading-row td { color: var(--t-text3); text-align: center; padding: 2rem; }

  /* ---------- 안내 상자 ---------- */
  .alert-info { background: var(--t-blue-weak); color: #1957c2; border: none; border-radius: var(--t-radius-sm); }

  /* ---------- 모달 ---------- */
  .modal-content { border: none; border-radius: 24px; }
  .modal-header, .modal-footer { border: none; padding: 20px 24px; }
  .modal-body { padding: 0 24px 8px; }
  .modal-title { font-size: 1.15rem; }

  /* ---------- 이미지 카드 ---------- */
  .file-card { position: relative; overflow: hidden; }

  .file-card .video-thumb { display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--t-text3); }
  .file-card .p-2 { padding: 14px !important; }
  .file-card.dim { opacity: .5; }
  .file-card.selected { box-shadow: 0 0 0 3px var(--t-blue); }
  .file-card .sel { position: absolute; top: 10px; left: 10px; width: 1.4rem; height: 1.4rem; z-index: 2; cursor: pointer; border-radius: 6px; }
  .file-name { font-size: .9rem; font-weight: 600; word-break: break-all; }

  /* ---------- 화면 미리보기 (로비 TV는 세로형 1080x1920) ---------- */
  .preview-wrap { position: relative; width: 100%; height: 78vh; min-height: 480px; overflow: hidden; border-radius: 16px; background: #191f28; }
  .preview-wrap iframe { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; border: 0; transform-origin: 0 0; }
  .preview-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #8b95a1; }

  /* ---------- 알림 / 저장 중 ---------- */
  #toastBox { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #toastBox .toast { width: auto; max-width: min(520px, calc(100vw - 32px)); background: rgba(25, 31, 40, .94) !important; color: #fff !important; border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); margin: 0 !important; }
  #toastBox .toast.text-bg-danger { background: var(--t-red) !important; }
  #toastBox .toast-body { padding: 14px 18px; font-weight: 600; }
  #busy { position: fixed; inset: 0; z-index: 3000; background: rgba(0, 0, 0, .2); display: none; align-items: center; justify-content: center; }
  #busy.show { display: flex; }
  #busy .box { background: #fff; border-radius: 16px; padding: 16px 24px; font-weight: 700; box-shadow: 0 8px 24px rgba(0, 0, 0, .12); }
  .spinner-border { color: var(--t-blue); }

  /* ---------- 공개 발표 화면 (배움터 추첨 등, 프로젝터용) ---------- */
  .stage { position: fixed; inset: 0; z-index: 2500; background: #191f28; color: #fff; overflow-y: auto; padding: 48px 56px; }
  .stage-close { position: fixed; top: 20px; right: 24px; width: 48px; height: 48px; border: none; border-radius: 50%; background: rgba(255, 255, 255, .12); color: #fff; font-size: 1.3rem; }
  .stage-title { font-size: clamp(2rem, 4vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; }
  .stage-info { font-size: clamp(1.1rem, 2vw, 1.6rem); color: #b0b8c1; margin: 8px 0 28px; }
  .stage-section { font-size: 1.4rem; font-weight: 700; color: #4593fc; margin: 24px 0 12px; }
  .stage-section.wait { color: #8b95a1; }
  .stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .stage-card { background: #fff; color: var(--t-text); border-radius: 18px; padding: 18px 20px; font-size: 1.5rem; font-weight: 700; opacity: 0; transform: translateY(12px); transition: opacity .4s, transform .4s; }
  .stage-card.show { opacity: 1; transform: none; }
  .stage-card small { display: block; font-size: .95rem; font-weight: 600; color: var(--t-blue); margin-bottom: 2px; }
  .stage-card.wait { background: #333d4b; color: #d1d6db; }
  .stage-card.wait small { color: #8b95a1; }
  .draw-card { background: var(--t-fill); border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: .9rem; }
  .draw-card small { display: block; color: var(--t-blue); font-size: .75rem; }
  .draw-card.wait small { color: var(--t-text3); }
  .age-bar { height: 8px; border-radius: 999px; background: var(--t-fill); overflow: hidden; margin: 4px 0 10px; }
  .age-bar > div { height: 100%; background: var(--t-blue); border-radius: 999px; }

  /* ---------- 전광판 미리보기 (실제 해상도로 그린 뒤 칸 너비에 맞춰 줄임) ---------- */
  .led-box { position: relative; width: 100%; overflow: hidden; background: #000; border-radius: 6px; }
  .led-inner { position: absolute; left: 0; top: 0; overflow: hidden; background: #000; transform-origin: 0 0; }
  .led-inner img { display: block; width: 100%; height: 100%; }
  .led-fixed { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
  .led-fixed span { white-space: pre; line-height: 1.15; }
  .led-run { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .led-fixed, .led-run { font-family: sans-serif; font-weight: 700; }
  .led-thumb { width: 180px; min-width: 180px; }

  /* ---------- 냉난방 현황 카드 ---------- */
  .hvac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .hvac-card { border: 1px solid var(--t-line, #e5e8eb); border-radius: 14px; padding: 10px 12px; background: var(--t-fill, #f9fafb); }
  .hvac-card.on { background: #e8f7ee; border-color: #b7e4c7; }
  .hvac-card.err { border-color: #f5a3a3; background: #fdecec; }
  .hvac-card.stale { opacity: .6; }
  .hvac-name { font-weight: 700; font-size: .9rem; line-height: 1.3; word-break: keep-all; }
  .hvac-temp { font-size: 1.5rem; font-weight: 800; margin-top: 4px; }

  /* ---------- 눌러서 여는 표 줄 / 사진 묶음 / 사진 크게 보기 ---------- */
  .clickable-row { cursor: pointer; }
  .photo-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .photo-thumb { position: relative; padding: 0; border: none; border-radius: 12px; overflow: hidden; aspect-ratio: 1; background: var(--t-fill); display: flex; align-items: center; justify-content: center; }
  .photo-thumb .photo-loading { position: absolute; color: var(--t-text3); }
  .photo-thumb img:not([src]) { visibility: hidden; }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
  .photo-thumb:hover img { transform: scale(1.04); }
  .photo-viewer { position: fixed; inset: 0; z-index: 3000; background: rgba(0, 0, 0, .92); display: flex; align-items: center; justify-content: center; }
  .photo-viewer.d-none { display: none !important; }
  .photo-viewer img { max-width: 92vw; max-height: 84vh; object-fit: contain; border-radius: 8px; }
  .viewer-close, .viewer-nav { position: absolute; border: none; border-radius: 50%; background: rgba(255, 255, 255, .14); color: #fff; width: 48px; height: 48px; font-size: 1.3rem; }
  .viewer-close { top: 16px; right: 16px; }
  .viewer-nav.prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .viewer-nav.next { right: 16px; top: 50%; transform: translateY(-50%); }
  .viewer-bar { position: absolute; bottom: 18px; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; color: #d1d6db; font-size: .9rem; }
  .viewer-bar a { color: #9fc5ff; }

  /* ---------- 휴대폰 ---------- */
  @media (max-width: 767px) {
    .app-header { padding: 0 16px; }
    .app-header .user { display: none; }
    .app-header .logout-label { display: none; }
    .app-header .brand { white-space: nowrap; }
    .app-header .user-box { gap: 8px; min-width: 0; }
    .app-header .user-text { min-width: 0; }
    .app-header .user-name { font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
    .layout { flex-direction: column; }
    .sidebar { width: 100%; min-height: auto; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--t-line); padding: 8px 4px; }
    .sidebar .module { margin: 0 4px; }
    .sidebar .sidebar-title { display: none; }
    .nav-tabs { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; }
    .nav-tabs .nav-link { white-space: nowrap; }
    .card.p-3 { padding: 18px !important; }
  }
</style>
