<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    .form-control, .form-select { min-height: 48px; }
    .btn { min-height: 44px; }
    .photo-section { border: 1px solid var(--t-line, #e5e8eb); border-radius: 16px; padding: 12px; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (min-width: 480px) { .photo-grid { grid-template-columns: repeat(4, 1fr); } }
    .photo-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--t-fill); }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
    .photo-item .photo-wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .photo-item .photo-tag { position: absolute; left: 4px; bottom: 4px; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; }
    .photo-item button.photo-del { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border: none; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; font-size: 12px; line-height: 1; }
    .upload-progress { height: 10px; border-radius: 999px; background: var(--t-fill); }
    .upload-progress .progress-bar { background: var(--t-blue); border-radius: 999px; transition: width .3s; }
    .save-bar { position: sticky; bottom: 0; z-index: 10; background: var(--t-bg, #fff); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
    #lightbox { position: fixed; inset: 0; z-index: 1050; background: rgba(0, 0, 0, .92); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #lightbox img { max-width: 100%; max-height: 80vh; object-fit: contain; }
    #lightbox .lb-bar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; color: #fff; }
    #lightbox .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: none; border-radius: 50%; background: rgba(255, 255, 255, .18); color: #fff; font-size: 20px; }
    #lightbox .lb-nav.prev { left: 8px; }
    #lightbox .lb-nav.next { right: 8px; }
  </style>
</head>
<body class="p-3 pb-0">
  <div style="max-width:560px;margin:0 auto">
    <h5 class="fw-bold mb-1"><i class="bi bi-tools me-1"></i>시설 보수 기록</h5>
    <div class="small text-muted mb-3">보수한 뒤 바로 입력하세요. 조치 전·후 사진은 각각 여러 장 올릴 수 있습니다.</div>

    <div class="alert alert-warning py-2 px-3 small d-none align-items-center justify-content-between gap-2" id="editBanner">
      <span id="editBannerText"></span>
      <button type="button" class="btn btn-sm btn-outline-dark" onclick="cancelEdit()">수정 취소</button>
    </div>

    <div class="card p-3 mb-3">
      <div class="mb-2">
        <label class="form-label small fw-bold" for="fDate">보수일자</label>
        <input type="date" class="form-control" id="fDate">
      </div>
      <div class="mb-2">
        <label class="form-label small fw-bold" for="fField">분야</label>
        <select class="form-select" id="fField"></select>
      </div>
      <div class="mb-2">
        <label class="form-label small fw-bold" for="fPlace">위치</label>
        <input class="form-control" id="fPlace" placeholder="예: 1층 화장실, 주차장">
      </div>
      <div class="mb-2">
        <label class="form-label small fw-bold" for="fContent">보수 내용</label>
        <textarea class="form-control" id="fContent" rows="3" placeholder="무엇을 어떻게 고쳤는지 적어 주세요"></textarea>
      </div>
      <div class="mb-2">
        <label class="form-label small fw-bold" for="fCause">원인·비고</label>
        <textarea class="form-control" id="fCause" rows="2" placeholder="고장 원인이나 참고 사항 (없으면 비워 두세요)"></textarea>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label small fw-bold" for="fResult">조치결과</label>
          <select class="form-select" id="fResult"></select>
        </div>
        <div class="col-6">
          <label class="form-label small fw-bold" for="fCost">비용(원)</label>
          <input type="number" class="form-control" id="fCost" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-bold" for="fQuality">사진 저장 크기</label>
        <select class="form-select form-select-sm" id="fQuality" onchange="rememberQuality()">
          <option value="small">작게 (1024px · 빠름, 데이터 적게)</option>
          <option value="normal">보통 (1600px · 기본)</option>
          <option value="high">고화질 (2048px · 글씨가 작을 때)</option>
        </select>
      </div>

      <div class="photo-section mb-3" data-section="before">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="fw-bold small mb-0">① 조치 전 사진</label>
          <span class="small text-muted" id="beforeCount">없음</span>
        </div>
        <div class="d-flex gap-2 mb-2">
          <button type="button" class="btn btn-light flex-fill text-nowrap" onclick="pick('before', 'camera')"><i class="bi bi-camera me-1"></i>사진 찍기</button>
          <button type="button" class="btn btn-light flex-fill text-nowrap" onclick="pick('before', 'gallery')"><i class="bi bi-images me-1"></i>갤러리</button>
        </div>
        <div class="photo-grid" id="beforeList"></div>
      </div>

      <div class="photo-section mb-3" data-section="after">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="fw-bold small mb-0">② 조치 후 사진</label>
          <span class="small text-muted" id="afterCount">없음</span>
        </div>
        <div class="d-flex gap-2 mb-2">
          <button type="button" class="btn btn-light flex-fill text-nowrap" onclick="pick('after', 'camera')"><i class="bi bi-camera me-1"></i>사진 찍기</button>
          <button type="button" class="btn btn-light flex-fill text-nowrap" onclick="pick('after', 'gallery')"><i class="bi bi-images me-1"></i>갤러리</button>
        </div>
        <div class="photo-grid" id="afterList"></div>
      </div>

      <!-- capture: 휴대폰에서 바로 카메라가 열림. 찍을 때마다 한 장씩 추가 -->
      <input type="file" id="fCamera" class="d-none" accept="image/*" capture="environment" onchange="addPhotos(this)">
      <input type="file" id="fGallery" class="d-none" accept="image/*" multiple onchange="addPhotos(this)">

      <div class="progress upload-progress d-none" id="progressWrap" role="progressbar" aria-label="저장 진행률">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
      <div class="small mt-2" id="status"></div>
    </div>

    <div class="save-bar">
      <button class="btn btn-primary w-100" id="saveBtn" onclick="submitRepair()"><i class="bi bi-save me-1"></i>저장</button>
    </div>

    <div class="card p-3 mb-4">
      <h6 class="fw-bold mb-2">최근 기록 (올해)</h6>
      <div class="small" id="recent"><span class="text-muted">불러오는 중…</span></div>
    </div>
  </div>

  <!-- 사진 크게 보기 -->
  <div id="lightbox" class="d-none" role="dialog" aria-label="사진 크게 보기">
    <div class="lb-bar">
      <span class="small" id="lbCount"></span>
      <button type="button" class="btn btn-sm btn-light" onclick="closeLightbox()"><i class="bi bi-x-lg"></i> 닫기</button>
    </div>
    <button type="button" class="lb-nav prev" onclick="moveLightbox(-1)" aria-label="이전 사진"><i class="bi bi-chevron-left"></i></button>
    <img id="lbImg" alt="">
    <button type="button" class="lb-nav next" onclick="moveLightbox(1)" aria-label="다음 사진"><i class="bi bi-chevron-right"></i></button>
    <div class="small text-white-50 mt-2" id="lbWait"></div>
  </div>

  <script>
    const CFG = <?!= JSON.stringify(repairConfig_()) ?>;
    // 압축 설정: 긴 변 픽셀 수와 JPEG 품질
    const PRESETS = {
      small: { max: 1024, quality: 0.7 },
      normal: { max: 1600, quality: 0.8 },
      high: { max: 2048, quality: 0.9 }
    };
    // 사진 칸: 조치 전(before), 조치 후(after). 항목은 { file, url } (새 사진) 또는 { link } (기존 사진)
    // url: 화면에 보이는 미리보기 (새 사진은 blob 주소, 기존 사진은 서버에서 받은 작은 이미지 데이터)
    // link: 기존 사진의 드라이브 주소 (저장할 때 그대로 다시 보냄)
    const SECTIONS = { before: [], after: [] };
    const MAX_PER_SECTION = 30;
    let editingNo = null;       // 수정 중이면 기록 번호
    let recentList = [];        // 최근 기록 (수정 버튼에 쓰임)
    let pendingSection = null;  // 사진을 고르는 중인 칸
    let viewer = { section: null, index: 0, token: 0 };

    function run(fn, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
      });
    }

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function setStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'small mt-2 ' + (isError ? 'text-danger' : 'text-success');
    }

    // done / total 만큼 진행 막대를 채우고 아래에 지금 하는 일을 보여줌
    function setProgress(done, total, label) {
      const pct = total ? Math.min(100, Math.round(done / total * 100)) : 0;
      document.getElementById('progressWrap').classList.remove('d-none');
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressWrap').setAttribute('aria-valuenow', pct);
      setStatus(label + ' · ' + pct + '%');
      document.getElementById('status').className = 'small mt-2 text-muted';
    }

    function hideProgress() {
      document.getElementById('progressWrap').classList.add('d-none');
      document.getElementById('progressBar').style.width = '0%';
    }

    // ---------- 압축 설정 (이 기기에 기억) ----------
    function loadQuality() {
      let saved = 'normal';
      try { saved = localStorage.getItem('repairQuality') || 'normal'; } catch (e) { /* 저장 못 하는 환경이면 기본값 */ }
      if (!PRESETS[saved]) saved = 'normal';
      document.getElementById('fQuality').value = saved;
    }

    function rememberQuality() {
      try { localStorage.setItem('repairQuality', document.getElementById('fQuality').value); } catch (e) { /* 무시 */ }
    }

    function currentPreset() {
      return PRESETS[document.getElementById('fQuality').value] || PRESETS.normal;
    }

    // ---------- 사진 고르기·빼기·미리보기 ----------
    function pick(section, how) {
      if (SECTIONS[section].length >= MAX_PER_SECTION) return setStatus('사진은 한 칸에 ' + MAX_PER_SECTION + '장까지 올릴 수 있습니다.', true);
      pendingSection = section;
      document.getElementById(how === 'camera' ? 'fCamera' : 'fGallery').click();
    }

    function addPhotos(input) {
      const section = pendingSection;
      const files = Array.from(input.files || []);
      input.value = '';   // 같은 사진을 다시 골라도 추가되도록 비움
      if (!section) return;
      const room = MAX_PER_SECTION - SECTIONS[section].length;
      files.slice(0, room).forEach(file => SECTIONS[section].push({ file: file, url: URL.createObjectURL(file) }));
      if (files.length > room) setStatus('한 칸에 ' + MAX_PER_SECTION + '장까지 올릴 수 있어 일부만 넣었습니다.', true);
      renderSection(section);
    }

    function removePhoto(section, i) {
      const item = SECTIONS[section][i];
      if (item.file) URL.revokeObjectURL(item.url);
      SECTIONS[section].splice(i, 1);
      renderSection(section);
    }

    function renderSection(section) {
      const items = SECTIONS[section];
      document.getElementById(section + 'List').innerHTML = items.map((p, i) =>
        '<div class="photo-item">' +
          (p.url
            ? '<img src="' + p.url + '" alt="' + (section === 'before' ? '조치 전' : '조치 후') + ' ' + (i + 1) + '번 사진" onclick="openLightbox(\'' + section + '\', ' + i + ')">'
            : p.failed
              ? '<div class="photo-wait small text-muted">불러오지 못함</div>'
              : '<div class="photo-wait spinner-border spinner-border-sm text-secondary"></div>') +
          '<span class="photo-tag">' + (i + 1) + '</span>' +
          '<button type="button" class="photo-del" onclick="removePhoto(\'' + section + '\', ' + i + ')" aria-label="사진 빼기"><i class="bi bi-x-lg"></i></button>' +
        '</div>'
      ).join('');
      document.getElementById(section + 'Count').textContent = items.length ? items.length + '장' : '없음';
    }

    // 기존 기록의 사진은 서버에서 작은 미리보기로 받아 옴
    function loadExistingPreview(section, item) {
      run('getRepairPhotoData', item.link, true).then(data => {
        item.url = data;
        renderSection(section);
      }).catch(() => {
        item.failed = true;
        renderSection(section);
      });
    }

    // 사진 크게 보기 (칸 안에서 좌우로 넘김). 기존 사진은 원본을 한 번 받아 씀
    function openLightbox(section, i) {
      viewer = { section: section, index: i, token: viewer.token + 1 };
      document.getElementById('lightbox').classList.remove('d-none');
      showLightboxPhoto();
    }

    function showLightboxPhoto() {
      const list = SECTIONS[viewer.section];
      const item = list[viewer.index];
      const token = viewer.token;
      const img = document.getElementById('lbImg');
      const wait = document.getElementById('lbWait');
      document.getElementById('lbCount').textContent = (viewer.section === 'before' ? '조치 전' : '조치 후') + ' · ' + (viewer.index + 1) + ' / ' + list.length;
      document.querySelectorAll('.lb-nav').forEach(b => b.classList.toggle('d-none', list.length < 2));
      if (item.file) {
        img.src = item.url;
        wait.textContent = '';
        return;
      }
      img.src = '';
      wait.textContent = '원본을 불러오는 중…';
      if (!item.full) {
        run('getRepairPhotoData', item.link, false).then(data => {
          item.full = data;
          if (token === viewer.token) { img.src = data; wait.textContent = ''; }
        }).catch(() => {
          if (token === viewer.token) wait.textContent = '사진을 불러오지 못했습니다.';
        });
      } else {
        img.src = item.full;
        wait.textContent = '';
      }
    }

    function moveLightbox(step) {
      const n = SECTIONS[viewer.section].length;
      if (n < 2) return;
      viewer.index = (viewer.index + step + n) % n;
      viewer.token += 1;
      showLightboxPhoto();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('d-none');
      document.getElementById('lbImg').src = '';
    }

    document.addEventListener('keydown', e => {
      if (document.getElementById('lightbox').classList.contains('d-none')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') moveLightbox(-1);
      if (e.key === 'ArrowRight') moveLightbox(1);
    });

    // ---------- 저장 ----------
    // 휴대폰 사진은 크기가 커서 선택한 크기로 줄여서 올림 (기본 1600px, JPEG)
    function shrinkPhoto(file, preset) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, preset.max / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve({
            name: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg',
            mime: 'image/jpeg',
            data: canvas.toDataURL('image/jpeg', preset.quality).split(',')[1]
          });
        };
        img.onerror = () => reject(new Error('사진을 읽을 수 없습니다. (아이폰 HEIC 사진이면 카메라 설정을 "호환성 우선"으로 바꿔 다시 찍어 주세요)'));
        img.src = url;
      });
    }

    function resetForm() {
      document.getElementById('fPlace').value = '';
      document.getElementById('fContent').value = '';
      document.getElementById('fCause').value = '';
      document.getElementById('fCost').value = '';
      document.getElementById('fDate').value = todayStr();
      ['before', 'after'].forEach(section => {
        SECTIONS[section].forEach(p => { if (p.file) URL.revokeObjectURL(p.url); });
        SECTIONS[section].length = 0;
        renderSection(section);
      });
    }

    async function submitRepair() {
      const entry = {
        no: editingNo,
        date: document.getElementById('fDate').value,
        field: document.getElementById('fField').value,
        place: document.getElementById('fPlace').value,
        content: document.getElementById('fContent').value,
        cause: document.getElementById('fCause').value,
        result: document.getElementById('fResult').value,
        cost: document.getElementById('fCost').value
      };
      if (!entry.date) return setStatus('보수일자를 입력해 주세요.', true);
      if (!entry.content.trim()) return setStatus('보수 내용을 적어 주세요.', true);
      if (SECTIONS.before.some(p => p.failed) || SECTIONS.after.some(p => p.failed)) {
        return setStatus('불러오지 못한 기존 사진이 있습니다. 빼거나 새로고침 후 다시 저장해 주세요.', true);
      }

      const btn = document.getElementById('saveBtn');
      const preset = currentPreset();
      const newCount = SECTIONS.before.concat(SECTIONS.after).filter(p => p.file).length;
      // 단계: 새 사진마다 (줄이기 반, 올리기 반) + 마지막 기록 저장 1
      const total = newCount + 1;
      let done = 0;
      btn.disabled = true;
      try {
        const urlsOf = async section => {
          const out = [];
          for (let i = 0; i < SECTIONS[section].length; i++) {
            const p = SECTIONS[section][i];
            if (!p.file) { out.push(p.link); continue; }   // 기존 사진은 드라이브 주소 그대로 씀
            setProgress(done, total, (section === 'before' ? '조치 전' : '조치 후') + ' 사진 ' + (i + 1) + ' 준비 중');
            const shrunk = await shrinkPhoto(p.file, preset);
            setProgress(done + 0.5, total, (section === 'before' ? '조치 전' : '조치 후') + ' 사진 ' + (i + 1) + ' 올리는 중');
            out.push(await run('uploadRepairPhoto', shrunk.mime, shrunk.data, { section: section, date: entry.date, field: entry.field, place: entry.place }));
            done += 1;
          }
          return out;
        };
        entry.beforePhotos = await urlsOf('before');
        entry.afterPhotos = await urlsOf('after');
        setProgress(done, total, '기록 저장 중');
        const no = await run('saveRepair', entry);
        setProgress(total, total, '저장 완료');
        setStatus('✔ ' + no + '번 기록을 ' + (editingNo ? '수정' : '저장') + '했습니다.' + (newCount ? ' (새 사진 ' + newCount + '장)' : ''));
        setTimeout(hideProgress, 1500);
        cancelEdit(true);
        resetForm();
        loadRecent();
      } catch (err) {
        hideProgress();
        setStatus((err && err.message) ? err.message.replace(/^Exception:\s*/, '') : String(err), true);
      } finally {
        btn.disabled = false;
      }
    }

    // ---------- 최근 기록과 수정 ----------
    function startEdit(no) {
      const r = recentList.filter(x => x.no === Number(no))[0];
      if (!r) return;
      editingNo = r.no;
      document.getElementById('fDate').value = r.date;
      document.getElementById('fField').value = r.field;
      document.getElementById('fPlace').value = r.place;
      document.getElementById('fContent').value = r.content;
      document.getElementById('fCause').value = r.cause;
      document.getElementById('fResult').value = r.result;
      document.getElementById('fCost').value = r.cost;
      ['before', 'after'].forEach(section => {
        SECTIONS[section].forEach(p => { if (p.file) URL.revokeObjectURL(p.url); });
        SECTIONS[section].length = 0;
        (section === 'before' ? r.before : r.after).forEach(link => SECTIONS[section].push({ link: link }));
        renderSection(section);
        SECTIONS[section].forEach(item => loadExistingPreview(section, item));
      });
      document.getElementById('editBannerText').textContent = r.no + '번 기록을 고치는 중입니다.';
      document.getElementById('editBanner').classList.remove('d-none');
      document.getElementById('editBanner').classList.add('d-flex');
      document.getElementById('saveBtn').innerHTML = '<i class="bi bi-save me-1"></i>수정 저장';
      setStatus('');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit(keepStatus) {
      editingNo = null;
      document.getElementById('editBanner').classList.add('d-none');
      document.getElementById('editBanner').classList.remove('d-flex');
      document.getElementById('saveBtn').innerHTML = '<i class="bi bi-save me-1"></i>저장';
      if (!keepStatus) {
        resetForm();
        setStatus('');
      }
    }

    function loadRecent() {
      run('getRepairList', Number(todayStr().slice(0, 4))).then(list => {
        recentList = list;
        document.getElementById('recent').innerHTML = list.length ? list.slice(0, 8).map(r =>
          '<div class="border-bottom py-2">' +
            '<div class="d-flex justify-content-between align-items-start gap-2">' +
              '<div><b>' + esc(r.date) + '</b> · ' + esc(r.field) + ' · ' + esc(r.place) + '</div>' +
              (r.mine ? '<button type="button" class="btn btn-sm btn-outline-secondary flex-shrink-0" onclick="startEdit(' + esc(r.no) + ')">수정</button>' : '') +
            '</div>' +
            '<div class="text-muted">' + esc(r.content) + '</div>' +
            '<div class="small text-muted">사진 조치 전 ' + r.before.length + '장 · 조치 후 ' + r.after.length + '장</div>' +
          '</div>'
        ).join('') : '<span class="text-muted">아직 기록이 없습니다.</span>';
      }).catch(() => {
        document.getElementById('recent').innerHTML = '<span class="text-muted">최근 기록을 불러오지 못했습니다.</span>';
      });
    }

    function init() {
      document.getElementById('fDate').value = todayStr();
      document.getElementById('fField').innerHTML = CFG.fields.map(v => '<option>' + esc(v) + '</option>').join('');
      document.getElementById('fResult').innerHTML = CFG.results.map(v => '<option>' + esc(v) + '</option>').join('');
      loadQuality();
      renderSection('before');
      renderSection('after');
      loadRecent();
    }
    init();
  </script>
</body>
</html>
