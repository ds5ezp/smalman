<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>연결 확인 중</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f2f4f6; color: #191f28; font-family: 'Malgun Gothic', sans-serif; }
    .box { text-align: center; background: #fff; border-radius: 20px; padding: 40px 48px;
           box-shadow: 0 6px 20px rgba(25,31,40,.08); }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { margin: 0; color: #4e5968; font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>인터넷에 연결할 수 없습니다</h1>
    <p>연결이 되면 자동으로 대시보드를 다시 불러옵니다.<br>잠시만 기다려 주세요.</p>
  </div>
</body>
</html>
